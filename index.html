{id:'k2u3',sem:'1학기',title:'인물의 마음을 짐작해요',goal:'인물의 말과 행동을 보고 마음을 짐작하며 이야기를 읽어요.',
 concept:[
  {t:'마음을 나타내는 말',h:`<p>기쁘다, 슬프다, 화나다, 무섭다, 부끄럽다, 고맙다, 미안하다, 설레다, 서운하다, 뿌듯하다…</p>`},
  {t:'마음을 짐작하는 방법',h:`<ul><li>인물이 한 <b>말</b>을 살펴요.</li><li>인물의 <b>행동과 표정</b>을 살펴요. (얼굴이 빨개졌어요, 고개를 숙였어요)</li><li>내가 그 인물이라면 어떤 마음일지 생각해 봐요.</li></ul>`}
 ],
 sets:[
  P('짝꿍의 지우개',`쉬는 시간에 민호는 짝꿍 수지의 지우개를 빌렸어요.
그런데 장난을 치다가 지우개를 반으로 뚝 부러뜨리고 말았어요.
민호는 얼굴이 빨개지고 가슴이 콩닥콩닥 뛰었어요.
'수지가 화를 내면 어떡하지?'
민호는 용기를 내어 말했어요.
"수지야, 정말 미안해. 내 지우개를 줄게."
수지는 잠깐 놀랐지만 곧 웃으며 말했어요.
"솔직하게 말해 줘서 고마워. 반씩 나누어 쓰자."`,[
   RD('민호는 어떤 실수를 했나요?','수지의 지우개를 부러뜨렸어요.',['수지의 연필을 잃어버렸어요.','수지를 밀었어요.','숙제를 안 했어요.'],''),
   RD('가슴이 콩닥콩닥 뛸 때 민호의 마음은?','걱정되고 불안해요.',['신나고 즐거워요.','배가 고파요.','졸려요.'],''),
   RD('민호가 용기를 내어 한 일은?','사과했어요.',['모른 척했어요.','울었어요.','선생님께 일렀어요.'],''),
   RD('마지막에 수지의 마음은?','민호가 솔직하게 말해 주어 고마워요.',['지우개가 부러져서 화가 나요.','민호가 미워요.','무서워요.'],'')]),
  P('운동회 날',`오늘은 운동회 날이에요.
청팀인 지아는 이어달리기 마지막 주자였어요.
바통을 받은 지아는 힘껏 달렸지만 결승선 바로 앞에서 넘어지고 말았어요.
무릎이 따끔따끔했지만 지아는 다시 일어나 끝까지 달렸어요.
청팀은 아쉽게 졌어요.
지아가 고개를 푹 숙이고 있는데 친구들이 다가와 어깨를 토닥였어요.
"끝까지 달린 네가 정말 멋졌어!"
지아의 눈에 눈물이 맺혔지만 입가에는 미소가 번졌어요.`,[
   RD('지아는 이어달리기에서 몇 번째 주자였나요?','마지막 주자',['첫 번째 주자','두 번째 주자','응원 단장'],''),
   RD('넘어진 뒤 지아는 어떻게 했나요?','다시 일어나 끝까지 달렸어요.',['울면서 그만두었어요.','친구에게 바통을 주었어요.','양호실에 갔어요.'],''),
   RD('고개를 푹 숙인 지아의 마음은?','속상하고 미안해요.',['자랑스러워요.','신나요.','배고파요.'],'청팀이 져서 자기 탓이라고 생각했을 거예요.'),
   RD('친구들의 말을 들은 지아의 마음은?','위로를 받아 고마워요.',['더 화가 나요.','부끄러워 숨고 싶어요.','아무렇지 않아요.'],'‘입가에 미소가 번졌어요’에서 알 수 있어요.')]),
  P('할아버지의 선물',`생일날 아침, 서준이는 할아버지께 작은 상자를 받았어요.
상자 안에는 낡은 나무 팽이가 들어 있었어요.
'에이, 새 장난감이 아니잖아.'
서준이는 입을 삐죽 내밀었어요.
그때 할아버지께서 말씀하셨어요.
"이 팽이는 할아버지가 어렸을 때 직접 깎아 만든 거란다."
할아버지가 줄을 감아 던지자 팽이가 쌩쌩 돌았어요.
서준이는 눈이 동그래졌어요.
"할아버지, 저도 가르쳐 주세요!"`,[
   RD('서준이가 받은 선물은?','나무 팽이',['로봇 장난감','동화책','자전거'],''),
   RD('입을 삐죽 내민 서준이의 마음은?','실망스러워요.',['고마워요.','무서워요.','설레요.'],'새 장난감이 아니라서 실망했어요.'),
   RD('눈이 동그래진 서준이의 마음은?','놀랍고 신기해요.',['슬퍼요.','화가 나요.','졸려요.'],''),
   RD('팽이는 누가 만들었나요?','할아버지',['서준이','아빠','장난감 가게 주인'],'')])
 ],
 gens:[
  {k:'vocab',w:3,f(){const [f,s]=pick(FEEL);return V(`<b>${s}</b> 드는 마음으로 가장 알맞은 것은?`,f,sample(FEEL.filter(x=>x[0]!==f),3).map(x=>x[0]),'');}},
  {k:'vocab',w:2,f(){const it=pick([['얼굴이 빨개지고 고개를 숙였어요.','부끄럽다'],['발을 동동 굴렀어요.','조마조마하다'],['어깨를 으쓱했어요.','자랑스럽다'],['입을 삐죽 내밀었어요.','서운하다'],['펄쩍펄쩍 뛰며 손뼉을 쳤어요.','기쁘다'],['눈물을 뚝뚝 흘렸어요.','슬프다'],['주먹을 꽉 쥐고 씩씩거렸어요.','화나다'],['이불 속으로 쏙 숨었어요.','무섭다']]);return V(`다음 행동에서 짐작할 수 있는 마음은?<br><b>${it[1]==='x'?'':it[0]}</b>`,it[1],sample(['부끄럽다','조마조마하다','자랑스럽다','서운하다','기쁘다','슬프다','화나다','무섭다'].filter(x=>x!==it[1]),3),'');}}
 ]},
{id:'k2u4',sem:'2학기',title:'낱말의 관계',goal:'뜻이 반대인 낱말, 뜻이 비슷한 낱말, 포함하는 낱말을 알아요.',
 concept:[
  {t:'뜻이 반대인 낱말',h:`${exb(OPP.slice(0,8).map(p=>p.join(' ↔ ')).join(', '))}`},
  {t:'뜻이 비슷한 낱말',h:`${exb(SIM.slice(0,6).map(p=>p.join(' ≒ ')).join(', '))}`},
  {t:'포함하는 말과 포함되는 말',h:`${exb('과일 ⊃ 사과, 배, 포도 &nbsp;&nbsp; 탈것 ⊃ 버스, 기차, 자전거')}${tip('‘사과는 과일이다’처럼 말이 되면 과일이 사과를 포함하는 말이에요.')}`}
 ],
 gens:[
  {k:'vocab',w:4,f(){const [a,b]=pick(OPP);const f=Math.random()<.5;const [x,y]=f?[b,a]:[a,b];return V(`‘${x}’와(과) 뜻이 반대인 낱말은?`,y,sample(OPP.flat().filter(z=>z!==x&&z!==y),3),`${x} ↔ ${y}`);}},
  {k:'vocab',w:4,f(){const [a,b]=pick(SIM);const f=Math.random()<.5;const [x,y]=f?[b,a]:[a,b];return V(`‘${x}’와(과) 뜻이 비슷한 낱말은?`,y,sample(SIM.flat().filter(z=>z!==x&&z!==y),3),`${x} ≒ ${y}`);}},
  {k:'vocab',w:3,f(){const k=pick(Object.keys(CAT));const odd=pick(CAT[pick(Object.keys(CAT).filter(x=>x!==k))]);return V(`‘${k}’에 포함되지 <b>않는</b> 낱말은?`,odd,sample(CAT[k],3),`${odd}은(는) ${k}이(가) 아니에요.`);}},
  {k:'vocab',w:2,f(){const pairs=[['동생이 키가 (   ).','작다','크다','형은 키가 크고'],['겨울은 날씨가 (   ).','춥다','덥다','여름은 덥고'],['거북은 (   ).','느리다','빠르다','토끼는 빠르고']];const it=pick(pairs);return V(`(   )에 알맞은 말은?<br><b>${it[3]}, ${it[0]}</b>`,it[1],[it[2]],'',{n:2});}}
 ]},
{id:'k2u5',sem:'2학기',title:'중요한 내용을 찾아요',goal:'설명하는 글을 읽고 무엇을 설명하는지, 중요한 내용이 무엇인지 찾아요.',
 concept:[
  {t:'설명하는 글',h:`<p>어떤 대상에 대해 알려 주는 글이에요. 무엇을 설명하는지(대상)를 먼저 찾아요.</p>${tip('‘첫째, 둘째’, ‘또’, ‘그래서’ 같은 말 뒤에 중요한 내용이 자주 나와요.')}`}
 ],
 sets:[
  P('고양이의 수염',`고양이 얼굴에는 길고 뻣뻣한 수염이 있어요.
수염은 고양이에게 아주 중요해요.
첫째, 수염으로 좁은 곳을 지나갈 수 있는지 알 수 있어요. 수염이 닿으면 몸이 지나가기 어렵다는 뜻이에요.
둘째, 수염으로 공기의 움직임을 느껴요. 그래서 어두운 곳에서도 부딪히지 않고 걸을 수 있어요.
그러니 고양이 수염은 절대 자르면 안 돼요.`,[
   RD('이 글은 무엇을 설명하나요?','고양이의 수염',['고양이의 털','고양이의 먹이','어두운 곳'],''),
   RD('수염이 하는 일로 알맞은 것은?','좁은 곳을 지나갈 수 있는지 알려 줘요.',['먹이를 씹어요.','소리를 내요.','몸을 따뜻하게 해요.'],''),
   RD('고양이가 어두운 곳에서도 부딪히지 않는 까닭은?','수염으로 공기의 움직임을 느껴서',['눈이 커서','꼬리가 길어서','귀가 쫑긋해서'],''),
   RD('글쓴이가 마지막에 하고 싶은 말은?','고양이 수염을 자르면 안 돼요.',['고양이를 길러요.','수염은 뻣뻣해요.','어두운 곳은 위험해요.'],'')]),
  P('곤충의 몸',`곤충은 몸이 머리, 가슴, 배 세 부분으로 나뉘어요.
머리에는 더듬이와 눈, 입이 있어요.
가슴에는 다리 여섯 개가 붙어 있어요. 날개가 있는 곤충은 날개도 가슴에 붙어 있어요.
개미, 나비, 메뚜기는 모두 곤충이에요.
하지만 거미는 다리가 여덟 개라서 곤충이 아니에요.`,[
   RI('곤충의 몸은 몇 부분으로 나뉘나요? (숫자로)',['3','세','셋','3부분','세 부분'],'머리, 가슴, 배'),
   RD('곤충의 다리는 몸의 어디에 붙어 있나요?','가슴',['머리','배','꼬리'],''),
   RD('곤충이 <b>아닌</b> 것은?','거미',['개미','나비','메뚜기'],'거미는 다리가 여덟 개예요.'),
   RD('더듬이는 어디에 있나요?','머리',['가슴','배','다리'],'')]),
  P('우리 몸의 뼈',`우리 몸에는 이백 개가 넘는 뼈가 있어요.
뼈는 우리 몸을 단단하게 받쳐 주어요. 뼈가 없다면 우리는 똑바로 서 있을 수 없을 거예요.
또 뼈는 몸속의 중요한 곳을 보호해요. 머리뼈는 뇌를, 갈비뼈는 심장과 폐를 지켜 주어요.
뼈를 튼튼하게 하려면 우유나 멸치처럼 칼슘이 많은 음식을 먹고, 햇볕을 쬐며 운동을 하는 것이 좋아요.`,[
   RD('뼈가 하는 일 두 가지는?','몸을 받쳐 주고, 중요한 곳을 보호해요.',['음식을 소화하고, 숨을 쉬어요.','피를 만들고, 소리를 들어요.','몸을 따뜻하게 하고, 땀을 내요.'],''),
   RD('갈비뼈가 지켜 주는 것은?','심장과 폐',['뇌','눈','위'],''),
   RD('뼈를 튼튼하게 하는 방법이 <b>아닌</b> 것은?','단 과자를 많이 먹어요.',['우유를 마셔요.','멸치를 먹어요.','햇볕을 쬐며 운동해요.'],''),
   OX('read','우리 몸에는 뼈가 열 개쯤 있어요.',false,'이백 개가 넘어요.')])
 ],
 gens:[{k:'vocab',w:2,f(){const [a,b]=pick(SIM);return V(`‘${a}’와(과) 뜻이 비슷한 낱말은?`,b,sample(SIM.flat().filter(z=>z!==a&&z!==b),3),'');}}]},
{id:'k2u6',sem:'2학기',title:'일이 일어난 차례',goal:'시간 순서를 나타내는 말을 살펴 일이 일어난 차례를 알아요.',
 concept:[
  {t:'차례를 나타내는 말',h:`${exb('먼저 → 다음으로 → 그다음에 → 마지막으로')}${exb('아침 → 점심 → 저녁, &nbsp; 봄 → 여름 → 가을 → 겨울')}`},
  {t:'차례대로 말하기',h:`<p>일이 일어난 차례를 정리하면 내용을 쉽게 기억하고 다른 사람에게 잘 전할 수 있어요.</p>`}
 ],
 sets:[
  P('샌드위치 만들기',`먼저 손을 깨끗이 씻어요.
다음으로 식빵 한 장 위에 딸기잼을 골고루 발라요.
그 위에 치즈와 상추를 차례로 올려요.
마지막으로 다른 식빵 한 장을 덮고 반으로 잘라요.
맛있는 샌드위치가 완성되었어요!`,[
   RD('가장 먼저 하는 일은?','손을 깨끗이 씻어요.',['식빵에 잼을 발라요.','치즈를 올려요.','반으로 잘라요.'],''),
   RD('딸기잼을 바른 다음에 하는 일은?','치즈와 상추를 올려요.',['손을 씻어요.','식빵을 덮어요.','접시를 닦아요.'],''),
   RD('차례대로 바르게 늘어놓은 것은?','손 씻기 → 잼 바르기 → 치즈·상추 올리기 → 빵 덮고 자르기',['잼 바르기 → 손 씻기 → 빵 덮고 자르기 → 치즈·상추 올리기','치즈·상추 올리기 → 잼 바르기 → 손 씻기 → 빵 덮고 자르기','빵 덮고 자르기 → 잼 바르기 → 손 씻기 → 치즈·상추 올리기'],'')],'방법'),
  P('나팔꽃이 자라요',`봄에 화분에 나팔꽃 씨앗을 심었어요.
며칠 뒤 흙 위로 작은 싹이 돋아났어요.
싹은 쑥쑥 자라 덩굴이 되어 막대를 감고 올라갔어요.
여름이 되자 보라색 나팔꽃이 활짝 피었어요.
가을에는 꽃이 진 자리에 까만 씨앗이 생겼어요.`,[
   RD('나팔꽃 씨앗을 심은 계절은?','봄',['여름','가을','겨울'],''),
   RD('싹이 돋아난 다음에 일어난 일은?','덩굴이 막대를 감고 올라갔어요.',['꽃이 피었어요.','씨앗이 생겼어요.','씨앗을 심었어요.'],''),
   RD('가을에 생긴 것은?','까만 씨앗',['보라색 꽃','작은 싹','새 화분'],''),
   RD('나팔꽃이 자란 차례로 알맞은 것은?','씨앗 → 싹 → 덩굴 → 꽃 → 씨앗',['싹 → 씨앗 → 꽃 → 덩굴','꽃 → 싹 → 덩굴 → 씨앗','덩굴 → 씨앗 → 싹 → 꽃'],'')]),
  P('학교 가는 길',`나는 아침 여덟 시에 집을 나서요.
아파트 앞 놀이터를 지나면 빵집이 나와요.
빵집 앞 횡단보도에서 초록불이 켜지면 손을 들고 건너요.
횡단보도를 건너 문구점을 지나면 바로 우리 학교 정문이에요.`,[
   RD('집을 나서는 시각은?','여덟 시',['일곱 시','아홉 시','여덟 시 반'],''),
   RD('놀이터를 지나면 나오는 곳은?','빵집',['문구점','학교','횡단보도'],''),

  P('김치',`김치는 우리 조상들의 지혜가 담긴 음식이다. 옛날에는 겨울에 채소를 구하기 어려웠다. 그래서 사람들은 가을에 배추와 무를 소금에 절이고 양념을 버무려 김치를 담갔다. 이렇게 담근 김치는 겨우내 상하지 않고 오래 먹을 수 있었다.

   RD('첫째 문단의 중심 문장은?','김치는 우리 조상들의 지혜가 담긴 음식이다.',['옛날에는 겨울에 채소를 구하기 어려웠다.','이렇게 담근 김치는 겨우내 상하지 않고 오래 먹을 수 있었다.','사람들은 가을에 배추와 무를 소금에 절였다.'],''),
   RD('둘째 문단의 중심 문장은?','김치는 몸에도 좋다.',['유산균은 장을 튼튼하게 해 준다.','양념은 몸을 따뜻하게 한다.','감기를 이겨 내는 데 도움을 준다.'],''),
   RD('김치의 유산균이 하는 일은?','장을 튼튼하게 해 줘요.',['몸을 차갑게 해요.','배추를 절여요.','김치를 빨리 상하게 해요.'],''),
   RD('사람들이 김치를 담근 계절은?','가을',['봄','여름','겨울'],'')]),
  P('숲이 하는 일',`숲은 우리에게 맑은 공기를 준다. 나무는 잎으로 이산화 탄소를 들이마시고 산소를 내보낸다. 그래서 숲에 가면 공기가 상쾌하게 느껴진다.

숲은 동물들의 보금자리이다. 다람쥐는 나무 구멍에 도토리를 모아 두고, 새들은 나뭇가지에 둥지를 튼다. 숲이 사라지면 이 동물들은 살 곳을 잃게 된다.

숲은 홍수도 막아 준다. 비가 많이 오면 나무뿌리와 흙이 물을 머금었다가 천천히 내보낸다.`,[
   RI('이 글은 모두 몇 문단일까요? (숫자로)',['3','세','셋','3문단','세 문단'],'한 칸 띄어진 덩어리를 세어 보세요.'),
   RD('둘째 문단의 중심 문장은?','숲은 동물들의 보금자리이다.',['다람쥐는 나무 구멍에 도토리를 모아 둔다.','새들은 나뭇가지에 둥지를 튼다.','숲이 사라지면 동물들은 살 곳을 잃게 된다.'],''),
   RD('숲이 홍수를 막는 방법은?','나무뿌리와 흙이 물을 머금었다가 천천히 내보내요.',['나무가 비를 막아 줘요.','동물들이 물을 마셔요.','산소를 내보내요.'],''),
   RD('글 전체의 중심 내용으로 알맞은 것은?','숲은 우리와 동물에게 여러 가지 도움을 준다.',['다람쥐는 도토리를 좋아한다.','비가 많이 오면 홍수가 난다.','나무는 산소를 내보낸다.'],'')]),
  P('줄넘기의 좋은 점',`줄넘기는 언제 어디서나 쉽게 할 수 있는 운동이다. 줄 하나만 있으면 운동장에서도, 집 앞 마당에서도 할 수 있다. 비싼 도구나 넓은 장소가 필요하지 않다.

줄넘기를 꾸준히 하면 몸이 튼튼해진다. 뛰는 동안 심장과 폐가 열심히 일해서 오래 달려도 덜 지치게 된다. 다리 근육과 뼈도 단단해진다.`,[
   RD('첫째 문단의 중심 문장은?','줄넘기는 언제 어디서나 쉽게 할 수 있는 운동이다.',['줄 하나만 있으면 된다.','비싼 도구가 필요하지 않다.','집 앞 마당에서도 할 수 있다.'],''),
   RD('둘째 문단의 뒷받침 문장이 <b>아닌</b> 것은?','줄넘기는 줄 하나만 있으면 할 수 있다.',['심장과 폐가 열심히 일한다.','다리 근육과 뼈도 단단해진다.','오래 달려도 덜 지치게 된다.'],'이 문장은 첫째 문단의 내용이에요.')])
 ],
 gens:[{k:'vocab',w:1,f(){return V('중심 문장에 대한 설명으로 알맞은 것은?','문단의 중심 내용을 담고 있어요.',['항상 문단의 가운데에 있어요.','예를 들어 설명하는 문장이에요.','문단마다 세 개씩 있어요.'],'');}}]},
{id:'k3u3',sem:'1학기',title:'높임 표현',goal:'웃어른께 알맞은 높임 표현을 사용해요.',

  {k:'vocab',w:2,f(){const it=pick([['나는 할머니께 인사를 했다.','저는 할머니께 인사를 드렸다.'],['우리 반은 선생님과 함께 공부했다.','저희 반은 선생님과 함께 공부했습니다.']]);return V('웃어른께 말씀드릴 때 알맞은 문장은?',it[1],[it[0]],'자기를 낮추어 ‘저, 저희’라고 해요.',{n:2});}},
  {k:'vocab',w:2,f(){const it=pick([['할머니(   ) 시장에 가셨다.','께서',['가','는','를']],['선생님(   ) 꽃을 드렸다.','께',['에게','한테','가']],['아버지께서 신문을 (   ).','읽으신다',['읽는다','읽어','읽자']]]);return V(`(   )에 알맞은 말은?<br><b>${it[0]}</b>`,it[1],it[2],'');}}
 ]},
{id:'k3u4',sem:'2학기',title:'인물, 사건, 배경',goal:'이야기의 인물, 사건, 배경을 알고 이야기를 깊이 있게 읽어요.',
 concept:[
  {t:'이야기의 세 요소',h:`${tableHTML(['요소','뜻'],[['인물','이야기에 나오는 사람이나 동물, 사물'],['사건','인물이 겪는 일'],['배경','일이 일어난 때(시간)와 곳(장소)']])}`},

 ],
 sets:[
  P('별 요정을 만난 아이',`어느 산골 마을에 하늘이라는 아이가 살았습니다. 하늘이는 밤마다 마당에 나와 별을 세었습니다.
어느 날 밤, 별 하나가 반짝이며 뒷산으로 떨어졌습니다. 하늘이는 손전등을 들고 뒷산으로 올라갔습니다.
나무 아래에는 날개를 다친 작은 별 요정이 웅크리고 있었습니다.
"하늘로 돌아가야 하는데 날 수가 없어."
하늘이는 손수건으로 요정의 날개를 감싸 주고, 밤새 곁을 지켰습니다.
새벽이 되자 요정의 날개가 다시 빛나기 시작했습니다. 요정은 하늘이의 손바닥에 작은 빛 조각 하나를 남기고 하늘로 날아올랐습니다.
그 뒤로 하늘이의 창가에는 밤마다 가장 밝은 별 하나가 반짝였습니다.`,[
   RD('이 이야기의 장소 배경이 <b>아닌</b> 것은?','바닷가',['산골 마을','뒷산','하늘이네 마당'],''),
   RD('이 이야기에 나오는 인물은?','하늘이, 별 요정',['하늘이, 엄마','별 요정, 달님','하늘이, 강아지'],''),
   RD('이 이야기의 중심 사건은?','하늘이가 날개를 다친 별 요정을 도와요.',['하늘이가 별을 세다가 잠들어요.','별 요정이 하늘이를 데려가요.','하늘이가 손전등을 잃어버려요.'],''),
   RD('하늘이의 성격으로 알맞은 것은?','따뜻하고 친절해요.',['겁이 많고 소심해요.','욕심이 많아요.','게으르고 무관심해요.'],'밤새 요정의 곁을 지켰어요.')]),
  P('깨진 화분',`토요일 오후, 도윤이는 거실에서 공을 차며 놀고 있었다. 엄마가 "거실에서는 공놀이하면 안 돼." 하고 여러 번 말씀하셨지만 도윤이는 '한 번만 더' 하며 공을 찼다.
그 순간 쨍그랑! 공이 창가의 화분을 맞혔다. 엄마가 아끼시는 난초 화분이었다.
도윤이는 깨진 화분 조각을 보며 어떻게 해야 할지 몰랐다. 동생 탓을 할까, 모른 척할까 고민하던 도윤이는 결국 부엌으로 가서 엄마께 사실대로 말씀드렸다.
엄마는 잠시 말이 없으시다가 도윤이를 안아 주셨다. "다치지는 않았니? 솔직하게 말해 줘서 고맙구나."
그날 저녁, 도윤이와 엄마는 새 화분에 난초를 옮겨 심었다.`,[
   RD('이 이야기의 시간 배경은?','토요일 오후',['월요일 아침','방학 첫날','크리스마스 밤'],''),
   RD('도윤이가 겪은 사건은?','공으로 화분을 깼어요.',['동생과 싸웠어요.','엄마께 꾸중을 들었어요.','난초를 선물 받았어요.'],''),
   RD('도윤이가 결국 한 행동은?','엄마께 사실대로 말씀드렸어요.',['동생 탓을 했어요.','모른 척했어요.','화분을 숨겼어요.'],''),
   RD('엄마의 말씀에서 알 수 있는 엄마의 마음은?','도윤이가 다치지 않았는지 걱정하고, 솔직함을 고마워해요.',['화분이 깨져서 몹시 화가 났어요.','도윤이가 미워요.','난초에 관심이 없어요.'],'')]),
  P('느티나무와 바람',`옛날, 들판 한가운데 커다란 느티나무가 있었어요. 느티나무 아래에는 개미들이 살았고, 가지에는 참새들이 살았어요.
어느 여름, 오랫동안 비가 내리지 않았어요. 개미들도 참새들도 목이 말라 힘들어했어요.
참새가 말했어요. "산 너머에는 맑은 샘이 있대. 하지만 너무 멀어서 우리 힘으로는 물을 나를 수 없어."
그때 느티나무가 잎을 흔들며 바람에게 부탁했어요. "바람아, 산 너머 구름을 이리로 데려와 주겠니?"
바람은 밤새 산을 넘어 구름을 몰고 왔어요. 다음 날 아침, 들판에 시원한 비가 내렸어요.
개미와 참새는 느티나무와 바람에게 고맙다고 인사했어요.`,[
   RD('이 이야기의 시간 배경(계절)은?','여름',['봄','가을','겨울'],''),
   RD('들판의 동물들이 힘들어한 까닭은?','오랫동안 비가 내리지 않아서',['바람이 너무 세게 불어서','느티나무가 쓰러져서','눈이 많이 와서'],''),
   RD('문제를 해결한 방법은?','바람이 산 너머 구름을 데려왔어요.',['참새가 샘물을 날랐어요.','개미가 우물을 팠어요.','느티나무가 뿌리로 물을 줬어요.'],''),
   RD('느티나무의 성격으로 알맞은 것은?','지혜롭고 다른 이를 생각해요.',['욕심이 많아요.','겁이 많아요.','심술궂어요.'],'')])
 ],
 gens:[{k:'vocab',w:1,f(){return V('이야기에서 ‘배경’이란?','일이 일어난 때와 곳',['이야기에 나오는 사람','인물이 겪는 일','이야기의 제목'],'');}}]},
{id:'k3u5',sem:'2학기',title:'사실과 의견',goal:'사실과 의견을 구별하고, 의견과 그 까닭을 찾아요.',
 concept:[
  {t:'사실과 의견',h:`${tableHTML(['사실','의견'],[['실제로 있었던 일이나 확인할 수 있는 내용','어떤 대상에 대한 자기 생각'],['예) 우리 학교에는 도서관이 있다.','예) 우리 학교 도서관은 정말 멋지다.']])}${tip('‘~라고 생각한다’, ‘~해야 한다’, ‘가장 ~하다’ 같은 말이 있으면 의견일 때가 많아요.')}`},
  {t:'의견과 까닭',h:`<p>의견을 말할 때는 그렇게 생각하는 <b>까닭</b>을 함께 말해야 다른 사람을 설득할 수 있어요.</p>`}
 ],
 sets:[
  P('급식을 남기지 말자',`우리 반 급식 시간이 끝나면 버려지는 음식이 많습니다. 저는 급식을 남기지 말아야 한다고 생각합니다.

또 버려진 음식물 쓰레기는 땅과 물을 더럽힙니다.
처음에는 먹을 만큼만 받고, 더 먹고 싶을 때 조금 더 받으면 음식을 남기지 않을 수 있습니다.`,[

{id:'k4u3',sem:'1학기',title:'한자어로 어휘 넓히기',goal:'낱말에 공통으로 들어간 한자의 뜻을 알고, 이를 이용해 어휘를 넓혀요.',

{id:'k4u5',sem:'2학기',title:'설명하는 글의 짜임',goal:'비교·대조, 나열, 순서, 원인과 결과 등 설명하는 글의 짜임을 알고 읽어요.',
 concept:[
  {t:'설명하는 글의 짜임',h:`${tableHTML(['짜임','설명','예'],STRUCT)}`},
  {t:'짜임을 알면 좋은 점',h:`<p>글의 짜임을 알면 중요한 내용을 쉽게 찾고, 틀(표, 그림)로 정리할 수 있어요.</p>${tip('‘반면에, 하지만’ → 비교·대조, ‘먼저, 다음으로’ → 순서, ‘그 까닭은, 그 결과’ → 원인과 결과')}`}
 ],
 sets:[
  P('개구리와 두꺼비',`개구리와 두꺼비는 모두 물과 땅을 오가며 사는 양서류이다. 둘 다 알에서 깨어나 올챙이 시기를 거쳐 어른이 된다.
하지만 생김새는 다르다. 개구리는 피부가 매끈하고 촉촉하지만, 두꺼비는 피부가 울퉁불퉁하고 건조하다.
움직이는 모습도 다르다. 개구리는 뒷다리가 길어서 폴짝폴짝 멀리 뛰고, 두꺼비는 뒷다리가 짧아서 엉금엉금 기듯이 걷는다.`,[
   RD('이 글의 짜임은?','비교·대조',['나열','순서(과정)','원인과 결과'],'두 대상의 같은 점과 다른 점을 견주었어요.'),
   RD('개구리와 두꺼비의 같은 점은?','올챙이 시기를 거쳐 어른이 된다.',['피부가 매끈하다.','뒷다리가 길다.','피부가 건조하다.'],''),
   RD('두꺼비의 특징은?','피부가 울퉁불퉁하고 건조하다.',['피부가 촉촉하다.','멀리 폴짝폴짝 뛴다.','뒷다리가 길다.'],''),
   RD('글의 내용을 정리하기에 가장 알맞은 틀은?','같은 점과 다른 점을 나누어 적는 표',['일이 일어난 차례를 적는 화살표','원인과 결과를 잇는 그림','여러 종류를 늘어놓는 목록'],'')]),
  P('종이가 만들어지는 과정',`우리가 쓰는 종이는 나무로 만든다. 먼저 숲에서 나무를 베어 껍질을 벗긴다. 다음으로 나무를 잘게 부수어 물과 약품을 넣고 끓이면 죽처럼 걸쭉한 펄프가 된다. 그다음에 펄프를 넓게 펴서 물기를 짜내고 뜨거운 롤러로 눌러 말린다. 마지막으로 다 마른 종이를 알맞은 크기로 자르면 종이가 완성된다.
종이 한 장에도 이렇게 많은 과정과 나무가 필요하므로 종이를 아껴 써야 한다.`,[
   RD('이 글의 짜임은?','순서(과정)',['비교·대조','나열','원인과 결과'],'‘먼저, 다음으로, 그다음에, 마지막으로’'),
   RD('‘펄프’는 무엇인가요?','나무를 부수어 끓인 죽처럼 걸쭉한 것',['나무의 껍질','다 만든 종이','뜨거운 롤러'],''),
   RD('나무 껍질을 벗긴 다음 하는 일은?','나무를 잘게 부수어 물과 약품을 넣고 끓여요.',['롤러로 눌러 말려요.','알맞은 크기로 잘라요.','숲에서 나무를 베어요.'],''),
   RD('글쓴이가 마지막에 하고 싶은 말은?','종이를 아껴 써야 한다.',['나무를 많이 베자.','종이 만드는 공장에 가 보자.','펄프는 걸쭉하다.'],'')]),
  P('미세 먼지',`봄철이면 하늘이 뿌옇게 흐려지는 날이 많다. 그 까닭은 공기 중에 떠다니는 아주 작은 먼지, 즉 미세 먼지 때문이다. 미세 먼지는 자동차 매연이나 공장의 연기, 그리고 다른 나라에서 바람을 타고 날아오는 먼지 때문에 생긴다.
미세 먼지는 머리카락 굵기보다 훨씬 작아서 코와 목에서 걸러지지 않고 몸속 깊이 들어온다. 그 결과 기침이 나거나 눈이 따갑고, 심하면 병에 걸릴 수도 있다.
따라서 미세 먼지가 많은 날에는 마스크를 쓰고, 밖에서 돌아오면 손과 얼굴을 깨끗이 씻어야 한다.`,[
   RD('이 글의 짜임은?','원인과 결과',['비교·대조','나열','순서(과정)'],'‘그 까닭은’, ‘그 결과’'),
   RD('미세 먼지가 생기는 까닭이 <b>아닌</b> 것은?','나무가 많아서',['자동차 매연','공장의 연기','다른 나라에서 날아오는 먼지'],''),
   RD('미세 먼지가 몸속 깊이 들어오는 까닭은?','머리카락보다 훨씬 작아서 걸러지지 않기 때문에',['색깔이 투명해서','냄새가 없어서','봄에만 생겨서'],''),
   RD('미세 먼지가 많은 날 해야 할 일은?','마스크를 쓰고 돌아와서 씻어요.',['창문을 활짝 열어요.','밖에서 오래 뛰어놀아요.','물을 마시지 않아요.'],'')])

{id:'k4u6',sem:'2학기',title:'주장과 근거',goal:'논설문에서 주장과 근거를 찾고, 근거가 알맞은지 판단해요.',
 concept:[
  {t:'논설문의 짜임',h:`${tableHTML(['부분','내용'],[['서론','문제 상황과 글쓴이의 주장'],['본론','주장을 뒷받침하는 근거와 자료'],['결론','주장을 다시 강조하고 마무리']])}`},
  {t:'알맞은 근거의 조건',h:`<ul><li>주장과 관련이 있어야 해요.</li><li>믿을 수 있는 사실이나 자료여야 해요.</li><li>읽는 사람이 고개를 끄덕일 수 있어야 해요.</li></ul>`}
 ],
 sets:[
  P('매일 책을 읽자',`[서론] 요즘 많은 어린이가 책보다 스마트폰 영상을 더 많이 봅니다. 저는 어린이도 매일 책을 읽어야 한다고 주장합니다.
[본론] 첫째, 책을 읽으면 어휘력이 자랍니다. 책에는 일상 대화에서 잘 쓰지 않는 다양한 낱말이 나옵니다.
둘째, 책을 읽으면 생각하는 힘이 길러집니다. 이야기 속 인물이 왜 그렇게 행동했는지 생각하며 읽으면 상상력과 판단력이 자랍니다.
셋째, 책 속에서 다양한 세계를 경험할 수 있습니다. 가 보지 못한 나라, 살아 보지 못한 시대를 책으로 만날 수 있습니다.
[결론] 하루에 이십 분이라도 좋으니 매일 책을 읽는 습관을 기릅시다.`,[
   RD('글쓴이의 주장은?','어린이도 매일 책을 읽어야 한다.',['스마트폰 영상을 보지 말자.','도서관을 많이 짓자.','이십 분 동안 운동하자.'],''),
   RD('주장에 대한 근거가 <b>아닌</b> 것은?','스마트폰은 값이 비싸다.',['어휘력이 자란다.','생각하는 힘이 길러진다.','다양한 세계를 경험할 수 있다.'],''),
   RD('서론에 들어 있는 내용은?','문제 상황과 주장',['근거 세 가지','주장을 다시 강조함','책 제목 소개'],''),
   RD('결론에서 글쓴이가 한 말은?','매일 책을 읽는 습관을 기르자.',['책은 어렵다.','영상도 좋다.','상상력은 중요하지 않다.'],'')],'논설문'),
  P('학교 앞 불법 주차를 없애야 합니다',`우리 학교 정문 앞에는 아침마다 자동차가 줄지어 서 있습니다. 저는 학교 앞 불법 주차를 없애야 한다고 생각합니다.
첫째, 주차된 자동차 때문에 어린이가 잘 보이지 않습니다. 운전자는 차 사이에서 갑자기 나오는 어린이를 미처 보지 못해 사고가 날 수 있습니다.
둘째, 길이 좁아져서 등교하는 학생들이 차도로 걸어야 할 때가 있습니다.
어른들께서는 학교 앞에 차를 세우지 말아 주시고, 학생들은 횡단보도로만 다니는 습관을 가집시다.`,[
   RD('글쓴이의 주장은?','학교 앞 불법 주차를 없애야 한다.',['학교 정문을 넓혀야 한다.','자동차를 타지 말아야 한다.','등교 시간을 늦춰야 한다.'],''),

const LOW='abcdefghijklmnopqrstuvwxyz';

function makeEngGens(u){

   {k:'listen',w:4,noPrint:true,f(){const w=pick(W);return MC('listen','🔊 소리를 듣고 알맞은 단어를 고르세요.',w[0],others(w,x=>x[0]),`${w[0]} : ${w[1]}`,{extra:{audio:w[0]}});}},
   {k:'listen',w:3,noPrint:true,f(){const w=pick(W);return MC('listen','🔊 소리를 듣고 알맞은 그림(뜻)을 고르세요.',`${w[2]} ${w[1]}`,others(w,x=>`${x[2]} ${x[1]}`),`${w[0]} = ${w[1]}`,{extra:{audio:w[0]}});}},

   {k:'word',w:4,f(){const w=pick(W);return MC('word',`<span class="big" style="font-family:var(--f-en)">${esc(w[0])}</span><br>이 단어의 뜻은?`,w[1],others(w,x=>x[1]),`${w[0]} = ${w[1]}`,{extra:{audio:w[0]}});}},

   gens.push({k:'spell',w:3,f(){const w=pick(sp);const s=w[0];const i=R(0,s.length-1);if(!/[a-z]/i.test(s[i]))return null;const shown=s.slice(0,i)+'_'+s.slice(i+1);const c=s[i].toLowerCase();
     return MC('spell',`${w[2]} ${w[1]}<br><span class="big" style="font-family:var(--f-en);letter-spacing:4px">${shown}</span><br>빈칸에 들어갈 알파벳은?`,c,sample(LOW.split('').filter(x=>x!==c),3),`정답: ${s}`,{extra:{audio:s}});}});
   if(g>=2)gens.push({k:'spell',w:3,f(){const w=pick(sp.filter(x=>x[0].length<=9));if(!w)return null;let sh;do{sh=shuffle(w[0].split('')).join('');}while(sh===w[0]&&w[0].length>2);

<script>
/* ===== 똑똑 공부방 : 화면과 학습 엔진 ===== */
'use strict';
const SUBJ={kor:{name:'국어',face:'🐰',pal:'토리',cls:'sk',desc:'어휘력·문해력으로 쑥쑥 읽기'},
            math:{name:'수학',face:'🐻',pal:'곰도리',cls:'sm2',desc:'계산력 + 줄글 문제 사고력'},
            eng:{name:'영어',face:'🦊',pal:'폭시',cls:'se',desc:'원어민 발음으로 단어 외우기'}};
const KINDS={kor:{read:'독해',vocab:'어휘·문법'},math:{calc:'계산',word:'문장제(사고력)'},eng:{listen:'듣기',word:'단어 뜻',spell:'철자 쓰기'}};
const PRAISE=['정답이에요!','최고예요!','잘했어요!','멋져요!','대단해요!','완벽해요!'];
const MARK=['①','②','③','④','⑤'];
const $app=()=>document.getElementById('app');
const h=(html)=>{const t=document.createElement('template');t.innerHTML=html.trim();return t.content.firstElementChild;};

/* ---------- 단원 찾기 ---------- */
function allUnits(){const a=[];for(const g in DB)for(const s in DB[g])a.push(...DB[g][s]);return a;}
function semesters(g,s){return [...new Set(DB[g][s].map(u=>u.sem))];}
function getUnit(id){
  if(id.startsWith('X')){ // 종합: X1math1
    const m=id.match(/^X(\d)(kor|math|eng)(\d)$/);if(!m)return null;const g=+m[1],s=m[2],sem=semesters(g,s)[+m[3]-1];
    const us=DB[g][s].filter(u=>u.sem===sem);if(!us.length)return null;
    return {id,grade:g,subj:s,sem,title:sem+' 종합 평가',goal:`${sem}에 배운 ${us.length}개 단원을 골고루 섞어 실력을 확인해요.`,mix:us,noLearn:true};
  }
  return allUnits().find(u=>u.id===id)||null;
}

function unitKinds(u){
  const us=u.mix||[u];const s=new Set();
  us.forEach(x=>{(x.gens||[]).forEach(g=>s.add(g.k));if(x.sets&&x.sets.length)s.add('read');(x.bank||[]).forEach(q=>s.add(q.k));});
  return Object.entries(KINDS[u.subj]).filter(([k])=>s.has(k));
}
/* ---------- 문제 뽑기 ---------- */
const clone=o=>JSON.parse(JSON.stringify(o));
function qKey(q){return (q.passage?q.passage.id:'')+'|'+q.q+'|'+(q.fig||'').length+'|'+(q.choices||[]).join('/')+'|'+(q.audio||'');}
function genQs(unit,n,kind='all',opt={}){
  if(unit.mix){ // 여러 단원 고르게
    const per=Math.ceil(n/unit.mix.length);let out=[];
    shuffle(unit.mix).forEach(u=>{out.push(...genQs(u,per,kind,Object.assign({},opt,{inMix:true})));});
    out=out.slice(0,n);return order(out);
  }
  const want=q=>q&&(kind==='all'||q.k===kind)&&!(opt.print&&q.noPrint);
  const out=[],seen=new Set();const add=q=>{if(!want(q))return false;const k=qKey(q);if(seen.has(k))return false;seen.add(k);q.unit=unit.id;out.push(q);return true;};
  // 1) 지문 세트
  const sets=shuffle(unit.sets||[]);
  const readTarget=kind==='read'?n:(kind==='all'?Math.ceil(n*(opt.inMix?.5:.6)):0);
  for(const s of sets){if(out.length>=readTarget)break;const qs=s.qs.map(q=>{const c=clone(q);c.k=c.k||'read';c.passage={id:s.title,title:s.title,text:s.text,kind:s.kind||''};return c;});
    if(out.length+qs.filter(want).length>n+1)continue;qs.forEach(add);}
  // 2) 문제 은행 + 생성기
  const bank=shuffle((unit.bank||[]).map(clone)).filter(want);
  const gens=(unit.gens||[]).filter(g=>(kind==='all'||g.k===kind)&&!(opt.print&&g.noPrint));
  const totalW=gens.reduce((s,g)=>s+(g.w||1),0);
  let tries=0;
  while(out.length<n&&tries<600){tries++;
    if(bank.length&&(!gens.length||Math.random()<.35)){add(bank.pop());continue;}
    if(!gens.length){if(!bank.length)break;continue;}
    let r=Math.random()*totalW,g=gens[0];for(const x of gens){r-=(x.w||1);if(r<=0){g=x;break;}}
    try{const q=g.f();if(q){q.k=q.k||g.k;add(q);}}catch(e){console.warn(unit.id,e);}
  }
  return opt.inMix?out:order(out);
}
function order(qs){ // 지문 문제는 지문끼리 모아서 뒤쪽에
  const plain=qs.filter(q=>!q.passage),pas=qs.filter(q=>q.passage);const groups={};pas.forEach(q=>{(groups[q.passage.id]=groups[q.passage.id]||[]).push(q);});
  return [...plain,...Object.values(groups).flat()];
}

/* ---------- 채점 ---------- */
const norm=s=>String(s==null?'':s).trim().replace(/[‘’`]/g,"'").replace(/\s+/g,'').replace(/,/g,'').replace(/[.。]$/,'').toLowerCase();
function same(resp,ans){const alts=Array.isArray(ans)?ans:[ans];const r=norm(resp);if(!r)return false;
  return alts.some(a=>{const x=norm(a);if(x===r)return true;const nr=Number(r),nx=Number(x);return r!==''&&!isNaN(nr)&&!isNaN(nx)&&nr===nx;});}
function check(q,resp){if(q.type==='mc')return resp===q.a;return q.fields.every((f,i)=>same(resp[i],f.a));}
const first=a=>Array.isArray(a)?a[0]:a;
function answerText(q,html=true){
  if(q.type==='mc')return (q.ox?'':MARK[q.a]+' ')+q.choices[q.a];
  if(q.frac){const f=q.fields;const w=f.find(x=>x.role==='w'),n=f.find(x=>x.role==='n'),d=f.find(x=>x.role==='d');return html?F(first(n.a),first(d.a),w&&first(w.a)!=='0'&&first(w.a)!==''?first(w.a):''):FS(first(n.a),first(d.a),w?first(w.a):'');}
  return q.fields.map(f=>(f.pre?f.pre+' ':'')+first(f.a)+(f.u?' '+f.u:'')).join(', ');
}

/* ---------- 문제 그리기 ---------- */
function speakBtn(text,lang='en-US',label='🔊 듣기',big=false){return `<button type="button" class="speak${big?' big':''}" data-say="${esc(text)}" data-lang="${lang}">${label}</button>`;}
function passageHTML(p,withSpeak=true){return `<div class="passage"><div class="p-title"><span>📄 ${esc(p.title)}</span>${withSpeak?speakBtn(p.text,'ko-KR','🔈 읽어 주기'):''}</div>${p.text}</div>`;}
function inputHTML(q,id){
  const im=a=>{const v=String(first(a));return /^-?\d+$/.test(v)?'numeric':/^-?[\d.]+$/.test(v)?'decimal':'text';};
  const attrs=(f,i)=>`id="${id}_${i}" class="ans-in${f.w?' wide':''}" inputmode="${im(f.a)}" autocomplete="off" autocapitalize="off" spellcheck="false" data-i="${i}"`;
  if(q.frac){const fs=q.fields;const box=r=>{const i=fs.findIndex(f=>f.role===r);return i<0?'':`<input ${attrs(fs[i],i)} aria-label="${{w:'자연수',n:'분자',d:'분모'}[r]}">`;};
    return `<div class="ans-row"><span>답:</span><span class="frac-in">${box('w')}<span class="stackf">${box('n')}<i></i>${box('d')}</span></span></div>`;}
  return `<div class="ans-row">${q.fields.map((f,i)=>`${f.pre?`<span>${f.pre}</span>`:''}<input ${attrs(f,i)} aria-label="답 ${i+1}">${f.u?`<span>${f.u}</span>`:''}`).join(' ')}</div>`;
}
function qBody(q,id,{showPassage=true}={}){
  const en=q.choices&&q.choices.every(c=>/^[A-Za-z][A-Za-z '.,!?-]*$/.test(c));
  return `${showPassage&&q.passage?passageHTML(q.passage):''}
   <div class="q-text">${q.q}</div>
   ${q.audio?`<div>${speakBtn(q.audio,'en-US',q.k==='listen'?'🔊 다시 듣기':'🔊 듣기',q.k==='listen')} ${q.k==='listen'?`<button type="button" class="speak" data-say="${esc(q.audio)}" data-lang="en-US" data-slow="1">🐢 천천히</button>`:''}</div>`:''}
   ${q.fig?`<div class="q-fig">${q.fig}</div>`:''}
   ${q.type==='mc'?`<div class="choices${q.choices.some(c=>c.length>22)||q.ox?' one':''}">${q.choices.map((c,i)=>`<button type="button" class="choice${en?' en':''}" data-c="${i}"><span class="mk">${q.ox?['O','X'][i]:i+1}</span><span>${c}</span></button>`).join('')}</div>`:inputHTML(q,id)}`;
}
document.addEventListener('click',e=>{const b=e.target.closest('[data-say]');if(b){e.preventDefault();TTS.speak(b.dataset.say,b.dataset.lang||'en-US',!!b.dataset.slow);}});

/* 한 문제 컴포넌트 */
function QuestionCard(q,{num,mode,onDone,showPassage=true}){
  const id='q'+Math.random().toString(36).slice(2,8);
  const el=h(`<div class="q-card" id="${id}">${num!=null?`<div class="q-top"><span class="q-num">${num}</span><span class="chip">${(KINDS[q.subj||curSubj()]||{})[q.k]||''}</span></div>`:''}${qBody(q,id,{showPassage})}<div class="q-act"></div><div class="q-fb"></div></div>`);
  let sel=null,tries=0,finished=false;
  const act=el.querySelector('.q-act'),fbox=el.querySelector('.q-fb');
  const inputs=[...el.querySelectorAll('.ans-in')];
  const resp=()=>q.type==='mc'?sel:inputs.map(x=>x.value);
  const api={el,q,resp,answered(){return q.type==='mc'?sel!=null:inputs.every(x=>x.value.trim()!=='');},
    mark(ok){finished=true;el.querySelectorAll('.choice').forEach((b,i)=>{b.disabled=true;if(i===q.a)b.classList.add('right');else if(i===sel&&!ok)b.classList.add('wrong');});
      inputs.forEach((x,i)=>{x.disabled=true;x.classList.remove('bad','ok');x.classList.add(same(x.value,q.fields[i].a)?'ok':'bad');});}};
  el.querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>{if(finished)return;sel=+b.dataset.c;
    el.querySelectorAll('.choice').forEach(x=>x.classList.toggle('sel',x===b));if(mode==='practice')submit();else if(onDone)onDone(api);}));
  inputs.forEach((x,i)=>{x.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();if(inputs[i+1])inputs[i+1].focus();else if(mode==='practice')submit();}});
    x.addEventListener('input',()=>{if(mode!=='practice'&&onDone)onDone(api);});});
  function feedback(ok,final){
    const s=SUBJ[q.subj||curSubj()]||SUBJ.math;
    if(ok)fbox.innerHTML=`<div class="fb ok"><div class="face">${s.face}</div><div><b>${pick(PRAISE)}</b>${q.ex?`<p>${q.ex}</p>`:''}</div></div>`;
    else if(!final)fbox.innerHTML=`<div class="fb no"><div class="face">🤔</div><div><b>한 번 더 생각해 볼까요?</b><p>${q.hint||'문제를 다시 천천히 읽어 보세요.'}</p></div></div>`;
    else fbox.innerHTML=`<div class="fb no"><div class="face">💪</div><div><b>정답은 ${answerText(q)}</b>${q.ex?`<p>${q.ex}</p>`:''}<p class="muted">오답 노트에 담아 두었어요.</p></div></div>`;
  }
  function submit(){if(finished)return;if(!api.answered()){toast('답을 먼저 써 주세요');return;}
    const ok=check(q,resp());tries++;
    if(ok||tries>=2){api.mark(ok);feedback(ok,true);if(!ok)Note.add(q);act.innerHTML='';onDone&&onDone(api,ok,tries);}
    else{feedback(false,false);if(q.type==='mc'){const b=el.querySelector(`.choice[data-c="${sel}"]`);b.classList.add('wrong');b.disabled=true;sel=null;}
      else inputs.forEach((x,i)=>{if(!same(x.value,q.fields[i].a)){x.classList.add('bad');x.select();}});}
  }
  if(mode==='practice'&&q.type!=='mc'){act.innerHTML=`<button type="button" class="btn primary">확인하기</button>`;act.firstChild.onclick=submit;}
  if(q.k==='listen'&&q.audio&&mode==='practice')setTimeout(()=>TTS.speak(q.audio),350);
  return api;
}
function curSubj(){return (document.body.className.match(/s-(\w+)/)||[])[1]||'math';}

/* ---------- 오답 노트 ---------- */
const Note={list(){return Store.get('note',[]);},
  add(q){const l=this.list();const k=qKey(q);if(l.some(x=>qKey(x)===k))return;const c=clone(q);c.subj=c.subj||curSubj();c.time=Date.now();l.unshift(c);Store.set('note',l.slice(0,300));},
  remove(q){Store.set('note',this.list().filter(x=>qKey(x)!==qKey(q)));}};

/* ---------- 화면 공통 ---------- */
function setTop(crumbs,subj){
  document.body.className=subj?'s-'+subj:'';
  document.getElementById('crumb').innerHTML=crumbs.map(c=>c[1]?`<a href="#${c[1]}">${c[0]}</a>`:c[0]).join(' › ');
  window.scrollTo(0,0);
}
function stars(score){if(score==null)return '<span class="muted">☆☆☆</span>';const n=score>=90?3:score>=70?2:score>=50?1:0;return `<span class="stars">${'★'.repeat(n)}${'☆'.repeat(3-n)}</span>`;}
const best=id=>Store.get('best_'+id,null);

/* 홈 */
function viewHome(){
  setTop([['처음 화면']]);
  const note=Note.list().length;
  $app().innerHTML=`<div class="stack">

function runTest(u,p,n,kind){
  const qs=genQs(u,n,kind);qs.forEach(q=>q.subj=u.subj);const t0=Date.now();
  p.innerHTML=`<div class="stack"><div class="row" style="justify-content:space-between"><h2>📝 ${u.title}</h2><span class="timer" id="tm">⏱️ 0:00</span></div>
   <div class="dots" id="dots">${qs.map((q,i)=>`<a href="#" data-j="${i}">${i+1}</a>`).join('')}</div><div class="test-list" id="tl"></div>
   <div class="sticky-bot"><button type="button" class="btn primary" id="tsub">제출하기 ✅</button></div><div id="tconf"></div></div>`;
  const tl=p.querySelector('#tl');const cards=[];let lastP=null;
  qs.forEach((q,i)=>{if(q.passage&&q.passage.id!==lastP){tl.appendChild(h(passageHTML(q.passage)));}lastP=q.passage?q.passage.id:null;
    const wrap=h(`<div class="test-q sticker" id="tq${i}"></div>`);
    const c=QuestionCard(q,{num:i+1,mode:'test',showPassage:false,onDone:api=>{p.querySelector(`#dots a[data-j="${i}"]`).classList.toggle('done',api.answered());}});
    wrap.appendChild(c.el);tl.appendChild(wrap);cards.push(c);});
  p.querySelectorAll('#dots a').forEach(a=>a.onclick=e=>{e.preventDefault();document.getElementById('tq'+a.dataset.j).scrollIntoView({behavior:'smooth',block:'center'});});
  const timer=setInterval(()=>{const el=document.getElementById('tm');if(!el){clearInterval(timer);return;}const s=Math.floor((Date.now()-t0)/1000);el.textContent=`⏱️ ${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;},1000);
  const sub=p.querySelector('#tsub');
  sub.onclick=()=>{const left=cards.filter(c=>!c.answered()).length;
    if(left&&!sub.dataset.sure){sub.dataset.sure=1;p.querySelector('#tconf').innerHTML=`<div class="fb no"><div class="face">🧐</div><div><b>아직 ${left}문제를 안 풀었어요.</b><p>그래도 내려면 제출하기를 한 번 더 눌러요.</p></div></div>`;return;}
    clearInterval(timer);grade();};
  function grade(){
    let right=0;cards.forEach((c,i)=>{const ok=check(c.q,c.resp());if(ok)right++;else Note.add(c.q);c.mark(ok);
      const w=document.getElementById('tq'+i);w.classList.add(ok?'ok':'no');
      c.el.querySelector('.q-fb').innerHTML=ok?`<div class="fb ok"><div class="face">⭕</div><div><b>정답</b>${c.q.ex?`<p>${c.q.ex}</p>`:''}</div></div>`:`<div class="fb no"><div class="face">❌</div><div><b>정답: ${answerText(c.q)}</b>${c.q.ex?`<p>${c.q.ex}</p>`:''}</div></div>`;});
    const score=Math.round(right/cards.length*100);const sec=Math.floor((Date.now()-t0)/1000);
    const prev=best(u.id);if(prev==null||score>prev)Store.set('best_'+u.id,score);
    const medal=score>=90?'🏆':score>=70?'🥇':score>=50?'🥈':'🌱';const msg=score>=90?'정말 훌륭해요!':score>=70?'잘했어요! 조금만 더!':score>=50?'좋아요, 틀린 문제를 다시 봐요.':'개념을 한 번 더 익히고 다시 도전해요!';
    const sent=sendResult(u,cards,right,score,sec);
    const res=h(`<div class="result sticker"><div class="medal">${medal}</div><div class="pt">${score}점</div>${stars(score)}<p>${cards.length}문제 중 ${right}문제 정답 · 걸린 시간 ${Math.floor(sec/60)}분 ${sec%60}초<br>${msg}</p>${sent}
      <div class="row" style="justify-content:center"><button type="button" class="btn" id="again">다시 시험 보기</button>${!u.noLearn?`<a class="btn" href="#u-${u.id}-${u.subj==='eng'?'words':'learn'}" style="text-decoration:none;color:inherit">개념 다시 보기</a>`:''}</div></div>`);
    p.querySelector('.sticky-bot').remove();p.querySelector('#tconf').innerHTML='';p.querySelector('.stack').prepend(res);res.querySelector('#again').onclick=()=>panelTest(u,p);
    window.scrollTo({top:0,behavior:'smooth'});
  }
}

  function draw(){
    if(!deck.length){p.innerHTML=`<div class="result sticker"><div class="medal">🎉</div><div class="pt">다 외웠어요!</div><p>이제 연습 문제와 시험으로 확인해 봐요.</p><div class="row" style="justify-content:center"><a class="btn primary" href="#u-${u.id}-practice" style="text-decoration:none;color:inherit">✏️ 연습하기</a><button type="button" class="btn" id="reset">처음부터 다시</button></div></div>`;
      p.querySelector('#reset').onclick=()=>{const k=Store.get('known',{});u.words.forEach(w=>delete k[w[0]]);Store.set('known',k);panelMemo(u,p);};return;}
    const w=deck[0];
    p.innerHTML=`<div class="stack"><div class="row" style="justify-content:space-between"><div class="filter"><button type="button" data-m="en" aria-pressed="${mode==='en'}">영어 보고 뜻 맞히기</button><button type="button" data-m="ko" aria-pressed="${mode==='ko'}">뜻 보고 영어 떠올리기</button><button type="button" data-m="ear" aria-pressed="${mode==='ear'}">듣고 맞히기</button></div><span class="chip">남은 카드 ${deck.length} / ${total}</span></div>
     <div class="flash sticker" id="fc"><div class="em">${mode==='ear'&&!shown?'👂':w[2]}</div>
      <div class="en ${mode!=='en'&&!shown?'hide':''}">${esc(w[0])}</div><div class="ko ${mode==='en'||mode==='ear'?(!shown?'hide':''):''}">${esc(w[1])}</div>
      ${speakBtn(w[0],'en-US','🔊 발음 듣기',true)}
      ${shown&&w[3]?`<div class="sent">${esc(w[3])}<br><span style="font-family:var(--f-body)">${esc(w[4]||'')}</span></div>`:''}</div>
     <div class="row" style="justify-content:center">${shown?`<button type="button" class="btn" id="no">😅 아직 몰라요</button><button type="button" class="btn primary" id="yes">😎 알아요!</button>`:`<button type="button" class="btn sub" id="flip">정답 보기 👀</button>`}</div>
     <p class="muted" style="text-align:center;margin:0">‘아직 몰라요’ 카드는 뒤에 다시 나와요. 소리 내어 따라 말해 보세요!</p></div>`;
    p.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{mode=b.dataset.m;shown=false;draw();});
    if(!shown)setTimeout(()=>TTS.speak(w[0]),250);
    if(shown){p.querySelector('#yes').onclick=()=>{const k=Store.get('known',{});k[w[0]]=1;Store.set('known',k);deck.shift();shown=false;doneN++;draw();};
      p.querySelector('#no').onclick=()=>{deck.push(deck.shift());if(deck.length>2){const x=deck.pop();deck.splice(2,0,x);}shown=false;draw();};}
    else p.querySelector('#flip').onclick=()=>{shown=true;draw();TTS.speak(w[0]);};
  }
  draw();
}

/* ---------- 오답 노트 화면 ---------- */
function viewNote(){
  setTop([['처음','home'],['오답 노트']]);
  let f='all';
  const render=()=>{const list=Note.list().filter(q=>f==='all'||q.subj===f);
    $app().innerHTML=`<div class="stack"><h1>📒 오답 노트</h1><p style="margin:0">틀렸던 문제를 다시 풀어요. 맞히면 노트에서 사라져요.</p>
     <div class="row" style="justify-content:space-between"><div class="filter">${[['all','전체'],['kor','국어'],['math','수학'],['eng','영어']].map(([k,v])=>`<button type="button" data-f="${k}" aria-pressed="${k===f}">${v}</button>`).join('')}</div><button type="button" class="btn small" id="clr">모두 지우기</button></div>
     <div id="nl" class="stack">${list.length?'':'<div class="sticker note-item"><b>틀린 문제가 없어요! 👏</b><span class="muted">연습이나 시험에서 틀린 문제가 여기에 모여요.</span></div>'}</div></div>`;
    $app().querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{f=b.dataset.f;render();});
    const clr=$app().querySelector('#clr');clr.onclick=()=>{if(!clr.dataset.sure){clr.dataset.sure=1;clr.textContent='정말 지울까요? 한 번 더 누르기';return;}Store.set('note',f==='all'?[]:Note.list().filter(q=>q.subj!==f));render();};
    const nl=$app().querySelector('#nl');
    list.slice(0,40).forEach((q,i)=>{const u=getUnit(q.unit||'');const box=h(`<div class="sticker note-item"><span class="chip">${SUBJ[q.subj]?SUBJ[q.subj].name:''} ${u?'· '+u.grade+'학년 '+u.title:''}</span></div>`);
      document.body.className='s-'+q.subj;
      const c=QuestionCard(q,{num:i+1,mode:'practice',onDone:(api,ok)=>{if(ok){Note.remove(q);toast('노트에서 지웠어요 ✨');}}});box.appendChild(c.el);nl.appendChild(box);});
    document.body.className='';
  };
  render();
}

/* ---------- 학번 & 구글 시트 전송 ---------- */
const sheetOn=()=>typeof CONFIG!=='undefined'&&!!CONFIG.sheetUrl;
const sessionStorageGet=k=>{try{return sessionStorage.getItem('ddok_'+k);}catch(e){return null;}};
const sessionStorageSet=k=>{try{sessionStorage.setItem('ddok_'+k,'1');}catch(e){}};
const Student={
  parse(v){v=String(v||'').trim();if(!/^[1-6][1-9]\d\d$/.test(v)||+v.slice(2)<1)return null;return {sid:v,grade:+v[0],cls:+v[1],num:+v.slice(2)};},
  get(){return this.parse(Store.get('sid',''));},
  label(p){return p?`${p.grade}학년 ${p.cls}반 ${p.num}번`:'';},
  set(v){Store.set('sid',v||'');updateWho();}
};
const Sync={
  busy:false,
  q(){return Store.get('sendq',[]);},
  push(rec){const q=this.q();q.push(rec);Store.set('sendq',q.slice(-300));return this.flush();},
  async flush(){
    if(!sheetOn()||this.busy)return false;const q=this.q();if(!q.length)return true;this.busy=true;let ok=false;
    try{await fetch(CONFIG.sheetUrl,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({records:q.slice(0,50)})});
      Store.set('sendq',this.q().slice(Math.min(q.length,50)));ok=true;}catch(e){}
    this.busy=false;if(ok&&this.q().length)return this.flush();return ok;
  }
};
window.addEventListener('online',()=>Sync.flush());
function updateWho(){
  const b=document.getElementById('whoBtn');if(!b)return;
  b.hidden=!sheetOn();const p=Student.get();b.textContent=p?'👤 '+p.sid:'👤 학번';b.setAttribute('aria-label',p?Student.label(p)+' (학번 바꾸기)':'학번 입력하기');
}
function openLogin(onDone,why){
  const cur=Student.get();
  const m=h(`<div class="modal-bg"><div class="modal sticker" role="dialog" aria-label="학번 입력"><h2>👤 학번을 입력해요</h2>
   ${why?`<p style="margin:0">${why}</p>`:''}
   <p class="muted" style="margin:0">학년 1자리 + 반 1자리 + 번호 2자리<br>예) 1학년 1반 1번 → <b>1101</b>, 3학년 2반 15번 → <b>3215</b></p>
   <input class="ans-in sid-in" id="sidIn" inputmode="numeric" maxlength="4" autocomplete="off" placeholder="1101" value="${cur?cur.sid:''}" aria-label="학번 4자리">
   <p id="sidMsg" class="sid-msg">${cur?'✅ '+Student.label(cur):'&nbsp;'}</p>
   <div class="row"><button type="button" class="btn primary" id="sidOk">확인</button><button type="button" class="btn" id="sidLater">${cur?'닫기':'나중에 할게요'}</button>${cur?'<button type="button" class="btn small" id="sidOut">학번 지우기</button>':''}</div>
   <p class="muted" style="margin:0;font-size:13px">시험을 보면 점수가 선생님께 전송돼요. 이름은 보내지 않아요.</p></div></div>`);
  document.body.appendChild(m);
  const inp=m.querySelector('#sidIn'),msg=m.querySelector('#sidMsg');
  const close=()=>{m.remove();onDone&&onDone(Student.get());};
  inp.oninput=()=>{inp.value=inp.value.replace(/\D/g,'').slice(0,4);const p=Student.parse(inp.value);
    msg.innerHTML=p?'✅ '+Student.label(p):inp.value.length===4?'❌ 학번을 다시 확인해요 (학년 1~6, 반 1~9, 번호 01~99)':'&nbsp;';};
  const ok=()=>{const p=Student.parse(inp.value);if(!p){msg.innerHTML='❌ 학번 4자리를 바르게 써요. 예) 1101';inp.focus();return;}Student.set(p.sid);toast(Student.label(p)+' 반가워요!');close();};
  m.querySelector('#sidOk').onclick=ok;inp.onkeydown=e=>{if(e.key==='Enter')ok();};
  m.querySelector('#sidLater').onclick=close;
  const out=m.querySelector('#sidOut');if(out)out.onclick=()=>{Student.set('');toast('학번을 지웠어요');close();};
  m.onclick=e=>{if(e.target===m)close();};
  setTimeout(()=>inp.focus(),50);
}
function sendResult(u,cards,right,score,sec){
  if(!sheetOn())return '';
  const p=Student.get();
  if(!p)return `<p class="send-st">📮 학번을 입력하지 않아서 선생님께 점수가 전송되지 않았어요.</p>`;
  const strip=s=>String(s||'').replace(/<[^>]+>/g,' ').replace(/&[a-z]+;/g,' ').replace(/\s+/g,' ').trim();
  const wrong=cards.map((c,i)=>check(c.q,c.resp())?null:`${i+1}번: ${strip(c.q.q).slice(0,40)}`).filter(Boolean).join('\n');
  Sync.push({t:Date.now(),sid:p.sid,grade:p.grade,cls:p.cls,num:p.num,subj:SUBJ[u.subj].name,ugrade:u.grade,unit:u.mix?u.title:`${u.sem} ${u.no||''}. ${u.title}`,type:u.mix?'학기 종합':'단원 평가',n:cards.length,right,score,sec,wrong});
  return `<p class="send-st">📮 ${Student.label(p)} 점수를 선생님께 보냈어요.</p>`;
}

/* ---------- 설정 ---------- */
function openSettings(){
  const vs=TTS.enVoices();
  const m=h(`<div class="modal-bg"><div class="modal sticker" role="dialog" aria-label="영어 발음 설정"><h2>🔊 영어 발음 설정</h2>
   <label>목소리 ${vs.length?'':'<span class="muted">(영어 음성을 찾지 못했어요. 기기 설정에서 영어 음성을 설치하면 더 좋아요.)</span>'}<select id="vsel"><option value="">자동 (미국 영어 추천 음성)</option>${vs.map(v=>`<option ${v.name===TTS.voiceName?'selected':''}>${esc(v.name)}</option>`).join('')}</select></label>
   <label>빠르기 <input type="range" id="vrate" min="0.5" max="1.2" step="0.05" value="${TTS.rate}"></label>
   <div class="row"><button type="button" class="btn small" id="vtest">들어 보기</button><button type="button" class="btn small primary" id="vclose">닫기</button></div></div></div>`);
  document.body.appendChild(m);
  m.querySelector('#vsel').onchange=e=>{TTS.voiceName=e.target.value;Store.set('voice',TTS.voiceName);};
  m.querySelector('#vrate').oninput=e=>{TTS.rate=+e.target.value;Store.set('rate',TTS.rate);};
  m.querySelector('#vtest').onclick=()=>TTS.speak('Hello! Nice to meet you. I like apples.');
  const close=()=>m.remove();m.querySelector('#vclose').onclick=close;m.onclick=e=>{if(e.target===m)close();};
}

/* ---------- 라우터 ---------- */
let curHash=(()=>{try{return decodeURIComponent(location.hash.slice(1))||'home';}catch(e){return 'home';}})();
function go(h){curHash=h;try{history.pushState(null,'','#'+h);}catch(e){}route();}
document.addEventListener('click',e=>{const a=e.target.closest('a[href^="#"]');if(!a||e.ctrlKey||e.metaKey)return;e.preventDefault();go(a.getAttribute('href').slice(1));});
window.addEventListener('popstate',()=>{curHash=decodeURIComponent(location.hash.slice(1))||'home';route();});
function route(){
  const hs=curHash||'home';let m;
  if(hs==='home')viewHome();
  else if(hs==='note')viewNote();
  else if((m=hs.match(/^g(\d)$/)))viewGrade(+m[1]);
  else if((m=hs.match(/^g(\d)-(kor|math|eng)$/)))viewSubject(+m[1],m[2]);
  else if((m=hs.match(/^u-([A-Za-z0-9]+)-(\w+)$/)))viewUnit(m[1],m[2]);
  else viewHome();
}
window.addEventListener('DOMContentLoaded',()=>{
  // 단원 번호 매기기
  for(const g in DB)for(const s in DB[g]){const c={};DB[g][s].forEach(u=>{c[u.sem]=(c[u.sem]||0)+1;u.no=c[u.sem];});}
  document.getElementById('homeBtn').onclick=()=>go('home');
  document.getElementById('noteBtn').onclick=()=>go('note');
  document.getElementById('whoBtn').onclick=()=>openLogin(()=>{if(curHash==='home')viewHome();});
  updateWho();
  route();
  if(sheetOn()){Sync.flush();if(CONFIG.askOnStart&&!Student.get()&&!sessionStorageGet('asked')){sessionStorageSet('asked');openLogin(()=>{if(curHash==='home')viewHome();});}}
});

<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>똑똑 공부방</title>
<meta name="description" content="초등 1~4학년 국어·수학·영어 개념 학습, 연습 문제, 시험, 시험지 인쇄">
<meta name="theme-color" content="#FFD23F">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="똑똑공부방">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&family=Fredoka:wght@500;600&display=swap">
<style>
/* 똑똑 공부방 — 만화 스티커 스타일: 굵은 잉크 테두리 + 오프셋 그림자, 모눈 공책 배경 */
:root{
  --ink:#2B2D42;
  --paper:#F3F9FF;
  --grid:#DCEBFA;
  --card:#FFFFFF;
  --sun:#FFD23F;
  --kor:#FF8FA3; --kor-soft:#FFE3E9;
  --math:#4DA8FF; --math-soft:#DCEEFF;
  --eng:#2FCB82; --eng-soft:#D8F7E8;
  --ok:#22B573; --ok-soft:#DDF8EA;
  --no:#FF5C5C; --no-soft:#FFE1E1;
  --muted:#6B6F86;
  --sub:var(--math); --sub-soft:var(--math-soft);
  --f-display:"Jua","Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-en:"Fredoka","Jua",system-ui,sans-serif;
  --r:18px;
  --sh:4px 4px 0 var(--ink);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  font-family:var(--f-body);font-size:17px;line-height:1.6;color:var(--ink);
  background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:28px 28px;
  min-height:100vh;
  -webkit-tap-highlight-color:transparent;
}
body.s-kor{--sub:var(--kor);--sub-soft:var(--kor-soft)}
body.s-math{--sub:var(--math);--sub-soft:var(--math-soft)}
body.s-eng{--sub:var(--eng);--sub-soft:var(--eng-soft)}
button{font:inherit;color:inherit;cursor:pointer}
input{font:inherit;color:var(--ink)}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.wrap{max-width:880px;margin:0 auto;padding-block:16px 80px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* 상단 바 */
.top{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:3px solid var(--ink)}
.top-in{max-width:880px;margin:0 auto;display:flex;align-items:center;gap:10px;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.logo{font-family:var(--f-display);font-size:22px;display:flex;align-items:center;gap:6px;background:none;border:0;padding:0;white-space:nowrap}
.logo b{background:var(--sun);border:2.5px solid var(--ink);border-radius:12px;padding:0 8px;box-shadow:2px 2px 0 var(--ink)}
.crumb{flex:1;min-width:0;font-size:14px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumb a{color:inherit;text-decoration:none}
.crumb a:hover{text-decoration:underline}
.icon-btn{border:2.5px solid var(--ink);background:var(--card);border-radius:12px;padding:4px 10px;box-shadow:2px 2px 0 var(--ink);font-size:15px;white-space:nowrap}
.icon-btn:active{transform:translate(2px,2px);box-shadow:none}

/* 공통 */
h1,h2,h3{font-family:var(--f-display);font-weight:400;line-height:1.25;text-wrap:balance;margin:0}
h1{font-size:clamp(28px,6vw,40px)}
h2{font-size:clamp(22px,4.5vw,28px)}
h3{font-size:20px}
.muted{color:var(--muted)}
.sticker{background:var(--card);border:3px solid var(--ink);border-radius:var(--r);box-shadow:var(--sh)}
.btn{font-family:var(--f-display);font-size:18px;border:3px solid var(--ink);border-radius:14px;padding:8px 18px;background:var(--card);box-shadow:3px 3px 0 var(--ink);transition:transform .08s}
.btn:active{transform:translate(3px,3px);box-shadow:none}
.btn.primary{background:var(--sun)}
.btn.sub{background:var(--sub)}
.btn.small{font-size:15px;padding:4px 12px;border-width:2.5px;box-shadow:2px 2px 0 var(--ink)}
.btn:disabled{opacity:.45;pointer-events:none}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.stack{display:flex;flex-direction:column;gap:16px}
.chip{display:inline-block;font-size:13px;border:2px solid var(--ink);border-radius:999px;padding:0 10px;background:var(--sub-soft);white-space:nowrap}
.stars{color:#F5A700;letter-spacing:1px;white-space:nowrap}

/* 홈 */
.hero{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center;padding:22px 24px;background:var(--sun)}
.hero p{margin:6px 0 0}
.mascots{display:flex;gap:6px;font-size:44px}
.mascots span{display:grid;place-items:center;width:64px;height:64px;border:3px solid var(--ink);border-radius:50%;background:var(--card);animation:bob 2.4s ease-in-out infinite}
.mascots span:nth-child(2){animation-delay:.3s}.mascots span:nth-child(3){animation-delay:.6s}
@keyframes bob{50%{transform:translateY(-6px) rotate(-4deg)}}
@media (max-width:560px){.hero{grid-template-columns:1fr}.mascots{font-size:34px}.mascots span{width:52px;height:52px}}
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
@media (max-width:680px){.grades{grid-template-columns:repeat(2,1fr)}}
.grade-card{border:3px solid var(--ink);border-radius:var(--r);box-shadow:var(--sh);padding:18px 10px 14px;text-align:center;font-family:var(--f-display);transition:transform .1s}
.grade-card:hover{transform:translateY(-3px) rotate(-1deg)}
.grade-card .big{font-size:54px;line-height:1}
.grade-card .lbl{font-size:22px}
.grade-card .sm{font-family:var(--f-body);font-size:13px;color:var(--ink);opacity:.75}
.g1{background:#FFE8A3}.g2{background:#FFD0DA}.g3{background:#C9E6FF}.g4{background:#C8F2DC}
.tools{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.tool{display:flex;gap:12px;align-items:center;padding:14px 16px;text-align:left}
.tool .em{font-size:34px}
.tool b{font-family:var(--f-display);font-weight:400;font-size:19px;display:block}
.tool span{font-size:14px;color:var(--muted)}

/* 과목 카드 */
.subjects{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media (max-width:640px){.subjects{grid-template-columns:1fr}}
.subj{padding:18px;text-align:left;display:flex;flex-direction:column;gap:6px}
.subj .face{font-size:46px;line-height:1;width:72px;height:72px;display:grid;place-items:center;border:3px solid var(--ink);border-radius:50%;background:var(--card)}
.subj b{font-family:var(--f-display);font-weight:400;font-size:26px}
.subj p{margin:0;font-size:14px}
.sk{background:var(--kor-soft)}.sm2{background:var(--math-soft)}.se{background:var(--eng-soft)}
.bar{height:10px;border:2px solid var(--ink);border-radius:999px;background:var(--card);overflow:hidden}
.bar i{display:block;height:100%;background:var(--sun)}

/* 단원 목록 */
.sem-title{font-family:var(--f-display);font-size:19px;margin:8px 0 -4px;display:flex;align-items:center;gap:8px}
.units{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media (max-width:640px){.units{grid-template-columns:1fr}}
.unit{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px 14px;text-align:left}
.unit .no{font-family:var(--f-display);font-size:20px;width:40px;height:40px;display:grid;place-items:center;border:2.5px solid var(--ink);border-radius:12px;background:var(--sub)}
.unit b{font-family:var(--f-display);font-weight:400;font-size:19px;display:block;line-height:1.3}
.unit small{color:var(--muted);font-size:13px;display:block;line-height:1.4}

/* 단원 상세 */
.unit-head{padding:18px 20px;background:var(--sub-soft)}
.unit-head .goal{margin:6px 0 0;font-size:15px}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:4px 4px 8px;margin:0 -4px}
.tab{flex:0 0 auto;font-family:var(--f-display);font-size:17px;border:3px solid var(--ink);border-radius:14px;padding:6px 14px;background:var(--card);box-shadow:3px 3px 0 var(--ink)}
.tab[aria-selected="true"]{background:var(--sub);transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.panel{padding:18px 20px}
@media (max-width:520px){.panel{padding:14px}}

/* 개념 */
.concept{display:flex;flex-direction:column;gap:14px}
.concept-card{border:2.5px dashed var(--ink);border-radius:16px;padding:14px 16px;background:var(--card)}
.concept-card h3{display:flex;gap:8px;align-items:center;margin-bottom:6px}
.concept-card h3::before{content:"";width:12px;height:12px;border-radius:50%;background:var(--sub);border:2px solid var(--ink);flex:0 0 auto}
.concept-card p{margin:6px 0}
.concept-card ul{margin:6px 0;padding-left:22px}
.tip{background:#FFF6CC;border:2px solid var(--ink);border-radius:12px;padding:8px 12px;font-size:15px;margin-top:8px}
.ex{background:var(--sub-soft);border-radius:12px;padding:8px 12px;margin:6px 0;font-size:16px}
.tbl{border-collapse:collapse;margin:6px 0;font-size:15px}
.tbl td,.tbl th{border:2px solid var(--ink);padding:4px 10px;text-align:center}
.tbl th{background:var(--sub-soft)}
.scroll-x{overflow-x:auto;max-width:100%}

/* 문제 카드 */
.q-card{display:flex;flex-direction:column;gap:12px}
.q-top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.q-num{font-family:var(--f-display);font-size:20px;background:var(--sub);border:2.5px solid var(--ink);border-radius:12px;padding:0 10px}
.q-text{font-size:19px;line-height:1.7;word-break:keep-all}
.q-text .big{font-size:30px;font-family:var(--f-display)}
.q-fig{display:flex;justify-content:center;max-width:100%;overflow-x:auto}
.q-fig svg{max-width:100%;height:auto}
.emo{font-size:30px;letter-spacing:2px;line-height:1.5;word-break:break-all}
.passage{background:#FFFDF5;border:2.5px solid var(--ink);border-radius:14px;padding:14px 16px;font-size:17px;line-height:1.9;white-space:pre-line;word-break:keep-all}
.passage .p-title{font-family:var(--f-display);font-size:18px;display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:4px;white-space:normal}
.choices{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.choices.one{grid-template-columns:1fr}
@media (max-width:520px){.choices{grid-template-columns:1fr}}
.choice{display:flex;gap:10px;align-items:center;text-align:left;border:3px solid var(--ink);border-radius:14px;padding:10px 14px;background:var(--card);box-shadow:3px 3px 0 var(--ink);font-size:18px;word-break:keep-all;min-height:52px}
.choice .mk{flex:0 0 auto;width:28px;height:28px;border-radius:50%;border:2.5px solid var(--ink);display:grid;place-items:center;font-family:var(--f-display);font-size:15px;background:var(--sub-soft)}
.choice.sel{background:var(--sun)}
.choice.right{background:var(--ok-soft);border-color:var(--ok)}
.choice.right .mk{background:var(--ok);color:#fff}
.choice.wrong{background:var(--no-soft);border-color:var(--no)}
.choice:disabled{cursor:default}
.choice.en{font-family:var(--f-en);font-size:20px}
.ans-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:19px}
.ans-in{width:120px;border:3px solid var(--ink);border-radius:12px;padding:8px 10px;font-size:20px;text-align:center;background:var(--card)}
.ans-in.wide{width:min(260px,100%)}
.ans-in.ok{background:var(--ok-soft);border-color:var(--ok)}
.ans-in.bad{background:var(--no-soft);border-color:var(--no)}
.frac-in{display:inline-flex;align-items:center;gap:6px}
.frac-in .stackf{display:inline-flex;flex-direction:column;align-items:center;gap:4px}
.frac-in .stackf i{display:block;width:70px;height:3px;background:var(--ink)}
.frac-in .ans-in{width:70px;padding:4px}
.fb{border:3px solid var(--ink);border-radius:14px;padding:12px 14px;display:flex;gap:12px;align-items:flex-start}
.fb.ok{background:var(--ok-soft)}
.fb.no{background:var(--no-soft)}
.fb .face{font-size:38px;line-height:1}
.fb b{font-family:var(--f-display);font-weight:400;font-size:20px}
.fb p{margin:2px 0 0;font-size:16px;word-break:keep-all}
.speak{border:2.5px solid var(--ink);border-radius:999px;background:var(--sun);padding:2px 12px;font-size:16px;box-shadow:2px 2px 0 var(--ink);white-space:nowrap}
.speak:active{transform:translate(2px,2px);box-shadow:none}
.speak.big{font-size:28px;padding:10px 26px}
.score-strip{display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-size:15px}
.filter{display:flex;gap:6px;flex-wrap:wrap}
.filter button{border:2.5px solid var(--ink);border-radius:999px;padding:2px 12px;background:var(--card);font-size:15px}
.filter button[aria-pressed="true"]{background:var(--sub)}

/* 분수 표기 */
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.1;margin:0 2px;font-size:.92em}
.fr>span:first-child{border-bottom:2px solid currentColor;padding:0 3px}
.fr>span:last-child{padding:0 3px}
.mixed{display:inline-flex;align-items:center;gap:1px;vertical-align:middle}

/* 시험 */
.test-list{display:flex;flex-direction:column;gap:16px}
.test-q{padding:16px}
.test-q.ok{border-color:var(--ok)}
.test-q.no{border-color:var(--no)}
.result{text-align:center;padding:22px;background:var(--sun)}
.result .medal{font-size:72px;line-height:1}
.result .pt{font-family:var(--f-display);font-size:48px}
.timer{font-family:var(--f-display);font-size:18px;font-variant-numeric:tabular-nums}
.sticky-bot{position:sticky;bottom:0;padding:10px 0 calc(10px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;gap:10px;z-index:5}
.dots{display:flex;flex-wrap:wrap;gap:4px}
.dots a{width:26px;height:26px;border:2px solid var(--ink);border-radius:8px;display:grid;place-items:center;font-size:12px;text-decoration:none;color:var(--ink);background:var(--card)}
.dots a.done{background:var(--sub)}

/* 단어 카드 */
.words{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.wcard{padding:12px;text-align:center;display:flex;flex-direction:column;gap:4px;align-items:center}
.wcard .em{font-size:44px;line-height:1.2}
.wcard .en{font-family:var(--f-en);font-size:24px;font-weight:600;word-break:break-word}
.wcard .ko{font-size:15px}
.wcard .row{justify-content:center;gap:6px}
.wcard.known{background:var(--eng-soft)}
.sent{font-family:var(--f-en);font-size:15px;color:var(--muted)}
.flash{max-width:420px;margin:0 auto;text-align:center;padding:26px 18px;display:flex;flex-direction:column;gap:10px;align-items:center;min-height:300px;justify-content:center}
.flash .em{font-size:90px;line-height:1.1}
.flash .en{font-family:var(--f-en);font-size:42px;font-weight:600}
.flash .ko{font-size:24px;font-family:var(--f-display)}
.flash .hide{color:transparent;background:var(--sub-soft);border-radius:10px;padding:0 24px}
.letters{font-family:var(--f-en);font-size:30px;letter-spacing:6px}

/* 오답노트 / 설정 */
.note-item{padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.modal-bg{position:fixed;inset:0;background:rgba(43,45,66,.45);display:grid;place-items:center;z-index:50;padding:16px}
.modal{max-width:440px;width:100%;padding:20px;display:flex;flex-direction:column;gap:12px}
.modal label{display:flex;flex-direction:column;gap:4px;font-size:15px}
.modal select,.modal input[type=range]{font:inherit;border:2.5px solid var(--ink);border-radius:10px;padding:4px 8px;background:var(--card)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 18px;border-radius:999px;z-index:60;font-size:15px}

/* 인쇄 설정 */
.print-opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.print-opts label{display:flex;flex-direction:column;gap:4px;font-size:15px}
.print-opts select{font:inherit;border:2.5px solid var(--ink);border-radius:10px;padding:6px 8px;background:var(--card)}
.check{flex-direction:row!important;align-items:center;gap:8px!important}
.preview-wrap{background:#E9EDF3;border:3px solid var(--ink);border-radius:var(--r);padding:16px;overflow-x:auto}

/* ===== 시험지(A4) ===== */
.sheet{background:#fff;color:#111;width:100%;max-width:794px;margin:0 auto 16px;padding:40px 44px;font-family:"Gowun Dodum","Malgun Gothic",sans-serif;font-size:14.5px;line-height:1.55;box-shadow:0 2px 10px rgba(0,0,0,.15)}
.sheet .sh-head{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:3px double #111;padding-bottom:8px;margin-bottom:14px;gap:12px}
.sheet .sh-title{font-family:var(--f-display);font-size:24px;line-height:1.2}
.sheet .sh-sub{font-size:13px;color:#444}
.sheet .sh-info{display:flex;gap:14px;font-size:13.5px;white-space:nowrap}
.sheet .sh-info span{border-bottom:1px solid #111;min-width:70px;display:inline-block}
.sheet .sh-body{columns:2;column-gap:28px;column-rule:1px solid #bbb}
.sheet .sh-body.one{columns:1}
.sheet .pq{break-inside:avoid;margin:0 0 16px}
.sheet .pq .n{font-weight:700;margin-right:4px}
.sheet .pq .qt{word-break:keep-all}
.sheet .pq .pc{margin:4px 0 0 18px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:2px 12px}
.sheet .pq .pc.one{grid-template-columns:1fr}
.sheet .pq .pa{margin:6px 0 0 18px}
.sheet .pq .box{display:inline-block;min-width:90px;border-bottom:1.5px solid #111;height:22px}
.sheet .pq .work{height:70px}
.sheet .pq svg{max-width:100%;height:auto}
.sheet .pq .emo{font-size:20px}
.sheet .ppass{break-inside:avoid;border:1.5px solid #111;border-radius:6px;padding:8px 10px;margin:0 0 10px;white-space:pre-line;font-size:14px;line-height:1.75;word-break:keep-all}
.sheet .ppass b{display:block;text-align:center}
.sheet .key{columns:2;column-gap:28px;font-size:13.5px}
.sheet .key div{break-inside:avoid;margin-bottom:6px}
.sheet .foot{margin-top:18px;text-align:center;font-size:11px;color:#777}
.sheet .fr>span:first-child{border-bottom-width:1.5px}
#print-area{display:none}

@media print{
  @page{size:A4;margin:12mm}
  body{background:#fff!important}
  body>*:not(#print-area){display:none!important}
  #print-area{display:block!important}
  .sheet{box-shadow:none;padding:0;max-width:none;margin:0}
  .sheet.page-break{break-before:page}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* 학번 입력 · 전송 */
.sid-in{width:100%;max-width:220px;font-size:32px;text-align:center;letter-spacing:8px;font-family:var(--f-display)}
.sid-msg{margin:0;min-height:1.4em;font-weight:600}
.send-st{margin:8px 0 0;font-size:14px;background:#fff;border:2px dashed var(--ink);border-radius:12px;padding:6px 10px;display:inline-block}
@media (max-width:420px){.top-in{gap:6px}.icon-btn{padding:4px 7px;font-size:14px}.logo{font-size:19px}}
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <button type="button" class="logo" id="homeBtn" aria-label="처음 화면"><b>똑똑</b>공부방</button>
  <nav class="crumb" id="crumb" aria-label="현재 위치"></nav>
  <button type="button" class="icon-btn" id="whoBtn" hidden>👤 학번</button>
  <button type="button" class="icon-btn" id="noteBtn">📒 오답</button>
</div></header>

function numWrongs(ans,spread=3,min=0){const s=new Set();let t=0;while(s.size<3&&t<60){t++;let d=R(1,spread)*(Math.random()<.5?-1:1);const v=ans+d;if(v>=min&&v!==ans)s.add(v);}return [...s];}

/* ---------- 그림(SVG) ---------- */
const INK='#2B2D42';
function svg(w,h,body,extra=''){return `<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" xmlns="http://www.w3.org/2000/svg" font-family="Gowun Dodum,Malgun Gothic,sans-serif" ${extra}>${body}</svg>`;}
function clockSVG(h,m,size=170){
  const c=size/2,r=c-8;let b=`<circle cx="${c}" cy="${c}" r="${r}" fill="#FFFDF0" stroke="${INK}" stroke-width="4"/>`;
  for(let i=0;i<60;i++){const a=i*6*Math.PI/180,l=i%5?r-5:r-11;b+=`<line x1="${c+Math.sin(a)*r}" y1="${c-Math.cos(a)*r}" x2="${c+Math.sin(a)*l}" y2="${c-Math.cos(a)*l}" stroke="${INK}" stroke-width="${i%5?1:2.5}"/>`;}
  for(let i=1;i<=12;i++){const a=i*30*Math.PI/180;b+=`<text x="${c+Math.sin(a)*(r-24)}" y="${c-Math.cos(a)*(r-24)+6}" text-anchor="middle" font-size="${size/10}" fill="${INK}" font-weight="700">${i}</text>`;}
  const ha=((h%12)+m/60)*30*Math.PI/180,ma=m*6*Math.PI/180;
  b+=`<line x1="${c}" y1="${c}" x2="${c+Math.sin(ha)*r*.5}" y2="${c-Math.cos(ha)*r*.5}" stroke="${INK}" stroke-width="7" stroke-linecap="round"/>`;
  b+=`<line x1="${c}" y1="${c}" x2="${c+Math.sin(ma)*r*.78}" y2="${c-Math.cos(ma)*r*.78}" stroke="#FF5C5C" stroke-width="4" stroke-linecap="round"/>`;
  b+=`<circle cx="${c}" cy="${c}" r="6" fill="${INK}"/>`;return svg(size,size,b);
}

  const c=size/2,r=size/2-8;let p=[];for(let i=0;i<n;i++){const a=(i/n)*2*Math.PI-Math.PI/2+rot;p.push((c+Math.cos(a)*r).toFixed(1)+','+(c+Math.sin(a)*r).toFixed(1));}
  return svg(size,size,`<polygon points="${p.join(' ')}" fill="${fill}" stroke="${INK}" stroke-width="4" stroke-linejoin="round"/>`);
}
function rectSVG(w,h,fill='#9ED0FF',label=''){const s=Math.min(160/w,100/h,30);const W=w*s+20,H=h*s+20;return svg(W,H,`<rect x="10" y="10" width="${w*s}" height="${h*s}" fill="${fill}" stroke="${INK}" stroke-width="3"/>${label}`);}
function fracBarSVG(n,d,width=260){const h=40,cw=(width-10)/d;let b='';for(let i=0;i<d;i++)b+=`<rect x="${5+i*cw}" y="5" width="${cw}" height="${h}" fill="${i<n?'#FF8FA3':'#fff'}" stroke="${INK}" stroke-width="2.5"/>`;return svg(width,h+10,b);}
function fracPieSVG(n,d,size=130){const c=size/2,r=c-6;let b='';if(d===1)return svg(size,size,`<circle cx="${c}" cy="${c}" r="${r}" fill="${n?'#4DA8FF':'#fff'}" stroke="${INK}" stroke-width="3"/>`);
  for(let i=0;i<d;i++){const a1=i/d*2*Math.PI-Math.PI/2,a2=(i+1)/d*2*Math.PI-Math.PI/2;const large=(1/d)>.5?1:0;
    b+=`<path d="M${c},${c} L${c+r*Math.cos(a1)},${c+r*Math.sin(a1)} A${r},${r} 0 ${large} 1 ${c+r*Math.cos(a2)},${c+r*Math.sin(a2)} Z" fill="${i<n?'#4DA8FF':'#fff'}" stroke="${INK}" stroke-width="2.5"/>`;}
  return svg(size,size,b);}
function angleSVG(deg,size=200,showArc=true){
  const cx=40,cy=size-40,L=size-70;const a=deg*Math.PI/180;
  let b=`<line x1="${cx}" y1="${cy}" x2="${cx+L}" y2="${cy}" stroke="${INK}" stroke-width="4" stroke-linecap="round"/>`;
  b+=`<line x1="${cx}" y1="${cy}" x2="${cx+Math.cos(a)*L}" y2="${cy-Math.sin(a)*L}" stroke="${INK}" stroke-width="4" stroke-linecap="round"/>`;
  if(showArc){const r=34;b+=`<path d="M${cx+r},${cy} A${r},${r} 0 ${deg>180?1:0} 0 ${cx+Math.cos(a)*r},${cy-Math.sin(a)*r}" fill="none" stroke="#FF5C5C" stroke-width="3"/>`;}

  const W=Math.max(cx+L+10,cx+Math.cos(a)*L+20);const minX=Math.min(0,cx+Math.cos(a)*L-20);
  return svg(W-minX,size,`<g transform="translate(${-minX},0)">${b}</g>`).replace(`viewBox="0 0 ${W-minX} ${size}"`,`viewBox="0 0 ${W-minX} ${size}"`);
}
function barGraphSVG(labels,vals,unit,step,title,horizontal=false){
  const max=Math.ceil(Math.max(...vals)/step)*step;const W=Math.max(300,labels.length*70+70),H=230,ox=50,oy=190,gh=160,gw=W-ox-15;
  let b=`<text x="${W/2}" y="16" text-anchor="middle" font-size="15" font-weight="700" fill="${INK}">${title}</text>`;
  for(let v=0;v<=max;v+=step){const y=oy-v/max*gh;b+=`<line x1="${ox}" y1="${y}" x2="${ox+gw}" y2="${y}" stroke="#B9C6D6" stroke-width="1"/><text x="${ox-6}" y="${y+4}" text-anchor="end" font-size="12" fill="${INK}">${v}</text>`;}
  const bw=gw/labels.length;labels.forEach((l,i)=>{const h=vals[i]/max*gh;b+=`<rect x="${ox+i*bw+bw*.22}" y="${oy-h}" width="${bw*.56}" height="${h}" fill="#4DA8FF" stroke="${INK}" stroke-width="2"/><text x="${ox+i*bw+bw/2}" y="${oy+18}" text-anchor="middle" font-size="13" fill="${INK}">${l}</text>`;});
  b+=`<line x1="${ox}" y1="${oy}" x2="${ox+gw}" y2="${oy}" stroke="${INK}" stroke-width="2.5"/><line x1="${ox}" y1="${oy}" x2="${ox}" y2="${oy-gh-4}" stroke="${INK}" stroke-width="2.5"/><text x="8" y="${oy-gh-8}" font-size="11" fill="${INK}">(${unit})</text>`;
  return svg(W,H+10,b);

  b+=`<line x1="${ox}" y1="${oy}" x2="${ox+gw}" y2="${oy}" stroke="${INK}" stroke-width="2.5"/><line x1="${ox}" y1="${oy}" x2="${ox}" y2="${oy-gh-4}" stroke="${INK}" stroke-width="2.5"/><text x="8" y="${oy-gh-8}" font-size="11" fill="${INK}">(${unit})</text>`;

/* ---------- 저장소 ---------- */
const Store={mem:{},get(k,d){try{const v=localStorage.getItem('ddok_'+k);if(v)return JSON.parse(v);}catch(e){}return k in this.mem?JSON.parse(this.mem[k]):d;},
  set(k,v){this.mem[k]=JSON.stringify(v);try{localStorage.setItem('ddok_'+k,this.mem[k]);}catch(e){}}};

/* ---------- 발음(음성 합성) ---------- */
const TTS={voices:[],rate:Store.get('rate',0.85),voiceName:Store.get('voice',''),
  init(){if(!('speechSynthesis' in window))return;const load=()=>{this.voices=speechSynthesis.getVoices();};load();speechSynthesis.onvoiceschanged=load;},
  enVoices(){return this.voices.filter(v=>/^en[-_](US|GB|AU|CA)/i.test(v.lang));},
  best(lang){
    if(lang.startsWith('ko'))return this.voices.find(v=>/^ko/i.test(v.lang));
    const en=this.enVoices();if(this.voiceName){const f=en.find(v=>v.name===this.voiceName);if(f)return f;}
    const pref=[/Google US English/i,/Natural/i,/Aria|Jenny|Guy|Ana/i,/Samantha|Alex/i,/Zira|David/i,/en-US/i];
    for(const p of pref){const f=en.find(v=>p.test(v.name)&&/US/i.test(v.lang))||en.find(v=>p.test(v.name));if(f)return f;}
    return en[0];},
  speak(text,lang='en-US',slow=false){
    if(!('speechSynthesis' in window)){toast('이 기기에서는 소리 듣기를 지원하지 않아요');return;}

    u.rate=lang.startsWith('ko')?0.95:(slow?0.55:this.rate);u.pitch=1.05;speechSynthesis.speak(u);}
};
TTS.init();
function toast(msg){const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),1800);}

 ],

  {k:'calc',w:3,f(){const n=R(1,9),e=pick(EMO_ITEMS);return C(`몇 개일까요?${emoRow(e,n)}`,n,`하나씩 세면 ${n}개예요.`,{u:'개'});}},
  {k:'calc',w:2,f(){const n=R(1,9);return MC('calc',`<span class="big">${n}</span> 을(를) 읽은 것을 고르세요.`,NAT1[n],NAT1.slice(1).filter((x,i)=>i+1!==n).sort(()=>Math.random()-.5),`${n}은(는) ‘${NAT1[n]}’ 또는 ‘${SINO[n]}’라고 읽어요.`);}},
  {k:'calc',w:2,f(){const n=R(1,8),big=Math.random()<.5;const v=big?n+1:n-1;if(v<0)return null;return C(`${n}보다 1만큼 더 ${big?'큰':'작은'} 수는?`,v,`수의 순서에서 ${n} 바로 ${big?'뒤':'앞'}의 수는 ${v}예요.`);}},
  {k:'calc',w:2,f(){const s=sample(range(0,9),4);const mx=Math.max(...s),mn=Math.min(...s),big=Math.random()<.5;return MC('calc',`가장 ${big?'큰':'작은'} 수는 어느 것일까요?`,big?mx:mn,s.filter(x=>x!==(big?mx:mn)),`수의 순서에서 ${big?'가장 뒤':'가장 앞'}에 있는 수가 ${big?mx:mn}이에요.`);}},
  {k:'calc',w:1,f(){const a=R(1,6);return C(`빈칸에 알맞은 수를 쓰세요.<br><span class="big">${a} - ${a+1} - □ - ${a+3}</span>`,a+2,`1씩 커지는 순서예요.`);}},
  {k:'word',w:2,f(){const a={n:pick(['참새','비둘기','까치','나비','잠자리']),u:'마리'},n=R(2,8);return W(`나무에 ${a.n} ${n}${a.u}가 앉아 있었어요. 1${a.u}가 더 날아왔어요. 이제 ${J(a.n,'은는')} 몇 ${a.u}일까요?`,n+1,a.u,`1만큼 더 큰 수 → ${n+1}${a.u}`);}},
  {k:'word',w:2,f(){const t=thing(),n=R(2,9);const who=nm();return W(`${J(who,'은는')} ${t.n} ${n}${J(t.u,'을를')} 가지고 있었는데 1${J(t.u,'을를')} 동생에게 주었어요. 남은 ${J(t.n,'은는')} 몇 ${t.u}일까요?`,n-1,t.u,`1만큼 더 작은 수 → ${n-1}${t.u}`);}},
  {k:'word',w:2,f(){const a=R(1,5),b=R(1,5);if(a+b-1>9||a+b-1<2)return null;const who=nm();return W(`친구들이 한 줄로 서 있어요. ${J(who,'은는')} 앞에서 ${ORD[a]}, 뒤에서 ${ORD[b]}에 서 있어요. 줄을 선 친구는 모두 몇 명일까요?`,a+b-1,'명',`앞에 ${a-1}명, 뒤에 ${b-1}명, 그리고 ${who} 1명 → ${a-1}+${b-1}+1 = ${a+b-1}명`,{extra:{hint:'그림을 그려 보세요. 나는 한 번만 세요!'}});}},
  {k:'word',w:2,f(){const [p,q]=names(2);const t=thing();let a=R(1,9),b=R(1,9);if(a===b)return null;return MC('word',`${J(p,'은는')} ${t.n} ${a}${t.u}, ${J(q,'은는')} ${t.n} ${b}${J(t.u,'을를')} 가지고 있어요. 누가 더 많이 가지고 있을까요?`,a>b?p:q,[a>b?q:p],`${Math.max(a,b)}은(는) ${Math.min(a,b)}보다 커요.`);}},
  {k:'word',w:1,f(){const n=R(3,9),k=R(2,n-1);return W(`🐟 물고기 ${n}마리 중에서 앞에서부터 ${ORD[k]}까지 색칠했어요. 색칠하지 않은 물고기는 몇 마리일까요?`,n-k,'마리',`${ORD[k]}까지 색칠 → ${k}마리 색칠, 남은 것은 ${n}-${k}=${n-k}마리`);}}
 ]},
{id:'m1u2',sem:'1학기',title:'여러 가지 모양',goal:'상자 모양, 둥근 기둥 모양, 공 모양을 찾고 특징을 알아요.',
 concept:[
  {t:'세 가지 모양',h:`${tableHTML(['모양','예','특징'],[['📦 상자 모양','선물 상자, 주사위, 우유갑','평평한 부분만 있어요. 잘 쌓을 수 있지만 굴러가지 않아요.'],['🥫 둥근 기둥 모양','음료수 캔, 풀, 북','평평한 부분과 둥근 부분이 있어요. 눕히면 굴러가고, 세우면 쌓을 수 있어요.'],['⚽ 공 모양','축구공, 구슬, 수박','둥근 부분만 있어요. 어느 쪽으로도 잘 굴러가고 쌓기 어려워요.']])}`},
  {t:'모양으로 만들기',h:`<p>여러 모양을 쌓고 붙여서 로봇이나 기차를 만들 수 있어요. 어떤 모양을 몇 개 썼는지 세어 봐요.</p>${tip('쌓을 때는 평평한 부분끼리 맞대면 잘 쌓여요.')}`}
 ],
 gens:(()=>{const S={box:['📦 택배 상자','🎁 선물 상자','🎲 주사위','🧃 주스 상자','📕 두꺼운 책','🧊 얼음 조각'],cyl:['🥫 통조림 캔','🥁 북','🧻 두루마리 휴지','🕯️ 양초','🔋 건전지','🥤 원통 컵'],ball:['⚽ 축구공','🏀 농구공','🍊 귤','🌍 지구본','🍉 수박','🔮 구슬']};
  const N={box:'상자 모양',cyl:'둥근 기둥 모양',ball:'공 모양'};const ks=Object.keys(S);
  return [
  {k:'calc',w:3,f(){const k=pick(ks);const o=pick(S[k]);return MC('calc',`<span class="big">${o}</span><br>어떤 모양일까요?`,N[k],ks.filter(x=>x!==k).map(x=>N[x]),`${o.slice(2)}은(는) ${N[k]}이에요.`);}},
  {k:'calc',w:3,f(){const k=pick(ks);const right=pick(S[k]);const wr=ks.filter(x=>x!==k).map(x=>pick(S[x]));wr.push(pick(S[pick(ks.filter(x=>x!==k))]));return MC('calc',`다음 중 <b>${N[k]}</b>인 것을 고르세요.`,right,wr,`${right.slice(2)}이(가) ${N[k]}이에요.`);}},
  {k:'calc',w:2,f(){const qs=[['평평한 부분만 있어서 굴러가지 않는 모양은?','box'],['둥근 부분만 있어서 어느 쪽으로도 잘 굴러가는 모양은?','ball'],['평평한 부분과 둥근 부분이 모두 있는 모양은?','cyl'],['쌓기 가장 어려운 모양은?','ball'],['눕히면 한쪽으로 굴러가고, 세우면 쌓을 수 있는 모양은?','cyl'],['여러 방향으로 잘 쌓을 수 있는 모양은?','box']];const [q,k]=pick(qs);return MC('calc',q,N[k],ks.filter(x=>x!==k).map(x=>N[x]),`${N[k]}의 특징이에요.`);}},
  {k:'word',w:3,f(){const k=pick(ks);const objs=shuffle([...sample(S.box,R(1,3)),...sample(S.cyl,R(1,3)),...sample(S.ball,R(1,3))]);const n=objs.filter(o=>S[k].includes(o)).length;
    return W(`민준이네 집에 있는 물건이에요.<div class="emo" style="font-size:20px">${objs.join(', ')}</div><b>${N[k]}</b>은 모두 몇 개일까요?`,n,'개',`${N[k]}: ${objs.filter(o=>S[k].includes(o)).join(', ')} → ${n}개`);}},
  {k:'word',w:2,f(){const a=R(1,4),b=R(1,4),c=R(1,3);return W(`상자 모양 ${a}개, 둥근 기둥 모양 ${b}개, 공 모양 ${c}개를 사용해서 로봇을 만들었어요. 로봇을 만드는 데 사용한 모양은 모두 몇 개일까요?`,a+b+c,'개',`${a}+${b}+${c}=${a+b+c}개`);}},
  {k:'word',w:1,f(){const a=R(3,6),b=R(1,a-1);return W(`둥근 기둥 모양 ${a}개와 상자 모양 ${b}개로 탑을 쌓았어요. 둥근 기둥 모양은 상자 모양보다 몇 개 더 많을까요?`,a-b,'개',`${a}-${b}=${a-b}개`);}}
 ];})()},
{id:'m1u3',sem:'1학기',title:'덧셈과 뺄셈',goal:'9까지의 수를 모으고 가르며, 덧셈식과 뺄셈식을 만들어요.',
 concept:[
  {t:'모으기와 가르기',h:`${exb('🍓🍓 와 🍓🍓🍓 를 <b>모으면</b> 5')}${exb('5는 2와 3으로 <b>가를</b> 수 있어요. (1과 4, 0과 5로도 가를 수 있어요)')}`},
  {t:'덧셈',h:`<p>더 많아지거나 합쳐질 때 덧셈을 해요.</p>${exb('3 + 2 = 5 &nbsp; 읽기: 3 더하기 2는 5와 같습니다. (3과 2의 <b>합</b>은 5)')}`},
  {t:'뺄셈',h:`<p>덜어 내거나, 남은 것을 구하거나, 두 수의 차이를 비교할 때 뺄셈을 해요.</p>${exb('7 - 3 = 4 &nbsp; 읽기: 7 빼기 3은 4와 같습니다. (7과 3의 <b>차</b>는 4)')}${tip('어떤 수에 0을 더하거나 빼면 그대로예요. 같은 수끼리 빼면 0이에요.')}`},
  {t:'문장을 식으로 바꾸기',h:`<p>‘더 왔어요, 모두, 합쳐서’ → 덧셈 / ‘먹었어요, 남은, 몇 개 더 많은’ → 뺄셈</p>`}
 ],
 gens:[
  {k:'calc',w:3,f(){const a=R(0,9),b=R(0,9-a);return EQ(`${a} + ${b}`,a+b,`${a}에서 ${b}만큼 이어 세면 ${a+b}`);}},
  {k:'calc',w:3,f(){const a=R(1,9),b=R(0,a);return EQ(`${a} - ${b}`,a-b,`${a}에서 ${b}만큼 거꾸로 세면 ${a-b}`);}},
  {k:'calc',w:2,f(){const n=R(2,9),a=R(1,n-1);return C(`${n}은(는) ${a}와(과) □로 가를 수 있어요. □는?`,n-a,`${a}+${n-a}=${n}`);}},
  {k:'calc',w:2,f(){const a=R(1,8),b=R(1,9-a);return C(`${a}와(과) ${b}를 모으면?`,a+b,`${a}+${b}=${a+b}`);}},
  {k:'calc',w:2,f(){const a=R(1,8),c=R(a+1,9);return C(`<span class="big">${a} + □ = ${c}</span>`,c-a,`${c}-${a}=${c-a}`);}},
  {k:'word',w:3,f(){const t=thing(),a=R(1,6),b=R(1,9-a),who=nm();return W(`${J(who,'은는')} ${t.n} ${a}${J(t.u,'을를')} 가지고 있었어요. 엄마께서 ${b}${J(t.u,'을를')} 더 주셨어요. ${who}가 가진 ${J(t.n,'은는')} 모두 몇 ${t.u}일까요?`,a+b,t.u,`식: ${a} + ${b} = ${a+b}`);}},
  {k:'word',w:3,f(){const a=animal(),n=R(4,9),k=R(1,n-1);return W(`연못에 ${a.n} ${n}${a.u}가 있었어요. 그중 ${k}${a.u}가 집으로 돌아갔어요. 남은 ${J(a.n,'은는')} 몇 ${a.u}일까요?`,n-k,a.u,`식: ${n} - ${k} = ${n-k}`);}},
  {k:'word',w:2,f(){const [p,q]=names(2),t=thing(),a=R(4,9),b=R(1,a-1);return W(`${J(p,'은는')} ${t.n} ${a}${t.u}, ${J(q,'은는')} ${b}${t.u} 가지고 있어요. ${J(p,'은는')} ${q}보다 몇 ${t.u} 더 많이 가지고 있을까요?`,a-b,t.u,`두 수의 차이: ${a} - ${b} = ${a-b}`);}},
  {k:'word',w:2,f(){const a=R(1,5),c=R(a+1,9);return W(`어떤 수에 ${a}를 더했더니 ${c}가 되었어요. 어떤 수는 얼마일까요?`,c-a,'',`□ + ${a} = ${c} → □ = ${c} - ${a} = ${c-a}`,{extra:{hint:'어떤 수를 □로 놓고 식을 세워 보세요.'}});}},
  {k:'word',w:1,f(){const n=R(5,9),b=R(1,3),g=n-b;return W(`우리 모둠은 ${n}명이에요. 그중 남학생이 ${b}명이에요. 여학생은 몇 명일까요?`,g,'명',`${n} - ${b} = ${g}`);}}
 ]},
{id:'m1u4',sem:'1학기',title:'비교하기',goal:'길이, 키, 무게, 넓이, 담을 수 있는 양을 비교하는 말을 알아요.',
 concept:[
  {t:'비교하는 말',h:`${tableHTML(['무엇을','비교하는 말'],[['길이','더 길다 ↔ 더 짧다'],['키·높이','더 크다 ↔ 더 작다, 더 높다 ↔ 더 낮다'],['무게','더 무겁다 ↔ 더 가볍다'],['넓이','더 넓다 ↔ 더 좁다'],['담을 수 있는 양','더 많다 ↔ 더 적다']])}`},
  {t:'세 가지를 비교할 때',h:`<p>‘가장’을 써요. 가장 길다, 가장 무겁다, 가장 넓다…</p>${exb('가는 나보다 길고, 다는 가보다 길면 → 다 &gt; 가 &gt; 나 → <b>다가 가장 길다</b>')}${tip('길이는 한쪽 끝을 맞추고 비교해요. 무게는 시소나 저울로 비교해요.')}`}
 ],
 gens:(()=>{const pairs=[['코끼리','개미','무겁다'],['수박','귤','무겁다'],['책상','지우개','무겁다'],['볼링공','탁구공','무겁다'],['기차','자전거','길다'],['줄넘기','연필','길다'],['기린','강아지','크다'],['아파트','우리집 강아지','높다'],['운동장','교실','넓다'],['양동이','컵','많다'],['욕조','물병','많다'],['달력','우표','넓다'],['어른','아기','크다'],['고래','금붕어','무겁다']];
  const opp={무겁다:'가볍다',길다:'짧다',크다:'작다',높다:'낮다',넓다:'좁다',많다:'적다'};
  const mod={무겁다:'더 무거운',가볍다:'더 가벼운',길다:'더 긴',짧다:'더 짧은',크다:'더 큰',작다:'더 작은',높다:'더 높은',낮다:'더 낮은',넓다:'더 넓은',좁다:'더 좁은',많다:'물을 더 많이 담을 수 있는',적다:'물을 더 적게 담을 수 있는'};
  return [
  {k:'calc',w:3,f(){const [a,b,adj]=pick(pairs);const use=Math.random()<.5?adj:opp[adj];const ans=use===adj?a:b;return MC('calc',`${a}와(과) ${b} 중에서 <b>${mod[use]}</b> 것은?`,ans,[ans===a?b:a],`${a}와(과) ${b} 중에서 ${mod[use]} 것은 ${ans}예요.`);}},
  {k:'calc',w:3,f(){const L=sample([2,3,4,5,6,7,8,9],3);const lab=['가','나','다'];const longest=Math.random()<.5;const tgt=longest?Math.max(...L):Math.min(...L);let b='';L.forEach((l,i)=>{b+=`<text x="10" y="${30+i*40}" font-size="16" fill="${INK}">${lab[i]}</text><rect x="35" y="${15+i*40}" width="${l*28}" height="20" rx="6" fill="${['#FF8FA3','#4DA8FF','#FFD23F'][i]}" stroke="${INK}" stroke-width="2.5"/>`;});
    return MC('calc',`왼쪽 끝을 맞추어 놓았어요. 가장 ${longest?'긴':'짧은'} 것은 어느 것일까요?`,lab[L.indexOf(tgt)],lab.filter((x,i)=>L[i]!==tgt),`오른쪽 끝이 가장 ${longest?'많이 나온':'덜 나온'} 것이 가장 ${longest?'길어요':'짧아요'}.`,{extra:{fig:svg(300,130,b)}});}},
  {k:'word',w:3,f(){const it=sample(['토끼','곰','여우','다람쥐','고양이','강아지'],3);const ord=shuffle([0,1,2]);// ord[0]이 가장 무거움
    const [H,M,L]=ord.map(i=>it[i]);const heavy=Math.random()<.5;
    return MC('word',`시소를 탔어요. ${J(H,'은는')} ${M}보다 무겁고, ${J(L,'은는')} ${M}보다 가벼워요. 가장 ${heavy?'무거운':'가벼운'} 동물은 누구일까요?`,heavy?H:L,it.filter(x=>x!==(heavy?H:L)),`무거운 순서: ${H} → ${M} → ${L}`,{extra:{hint:'무거운 순서대로 줄을 세워 보세요.'}});}},
  {k:'word',w:2,f(){const it=sample(['빨간 끈','파란 끈','노란 끈','초록 끈'],3);const [A,B,Cc]=it;return MC('word',`${J(A,'은는')} ${B}보다 길어요. ${J(Cc,'은는')} ${A}보다 길어요. 가장 짧은 끈은 무엇일까요?`,B,[A,Cc],`긴 순서: ${Cc} → ${A} → ${B}`);}},
  {k:'calc',w:2,f(){const [a,b,adj]=pick(pairs);const ws=[adj,opp[adj]];const ans=adj;const end={무겁다:'무겁습니다',가볍다:'가볍습니다',길다:'깁니다',짧다:'짧습니다',크다:'큽니다',작다:'작습니다',높다:'높습니다',낮다:'낮습니다',넓다:'넓습니다',좁다:'좁습니다',많다:'많이 담을 수 있습니다',적다:'적게 담을 수 있습니다'};
    return MC('calc',`알맞은 말을 고르세요.<br>${J(a,'은는')} ${b}보다 더 (&nbsp;&nbsp;&nbsp;&nbsp;).`,end[ans],[end[opp[adj]]],`${a}이(가) ${b}보다 더 ${end[ans]}`);}},
  {k:'word',w:2,f(){const cups=R(3,6),b=R(cups+1,cups+5);return MC('word',`같은 컵으로 물을 부었어요. 노란 물병에는 ${cups}컵, 파란 물병에는 ${b}컵이 들어갔어요. 물을 더 많이 담을 수 있는 물병은?`,'파란 물병',['노란 물병'],`컵의 수가 더 많은 ${b}컵이 들어간 파란 물병이 더 많이 담을 수 있어요.`);}},

{id:'m1u5',sem:'1학기',title:'50까지의 수',goal:'10개씩 묶음과 낱개로 50까지의 수를 알고, 순서와 크기를 비교해요.',

  {k:'calc',w:2,f(){const n=R(11,50);const right=natRead(n);const ws=[natRead(Math.min(50,n+10)),natRead(n%10?((n%10)*10+Math.floor(n/10))%50||n+1:n+1),natRead(n>11?n-1:n+2)];return MC('calc',`<span class="big">${n}</span> 을(를) 바르게 읽은 것은?`,right,ws,`${n}은(는) ‘${sinoRead(n)}’ 또는 ‘${right}’라고 읽어요.`);}},

 ]},
{id:'m1u6',sem:'2학기',title:'100까지의 수',goal:'99까지의 수와 100을 알고, 짝수와 홀수, 수의 순서와 크기를 알아요.',

  {k:'calc',w:2,f(){const n=R(51,99);return MC('calc',`<span class="big">${n}</span> 을(를) 읽은 것은?`,natRead(n),[natRead(n>60?n-10:n+10),natRead(Math.min(99,n+1)),natRead(n-1)],`${sinoRead(n)} 또는 ${natRead(n)}`);}},
  {k:'calc',w:2,f(){const n=R(10,99);const e=n%2===0;return MC('calc',`<span class="big">${n}</span> 은(는) 짝수일까요, 홀수일까요?`,e?'짝수':'홀수',[e?'홀수':'짝수'],`일의 자리 숫자가 ${n%10}이므로 ${e?'짝수':'홀수'}예요.`);}},
  {k:'calc',w:2,f(){const st=R(1,5)*(Math.random()<.5?1:10),a=R(50,99-3*st);const seq=[a,a+st,a+2*st,a+3*st];const hole=R(1,3);return C(`규칙에 맞게 빈칸을 채우세요.<br><span class="big">${seq.map((v,i)=>i===hole?'□':v).join(' → ')}</span>`,seq[hole],`${st}씩 커지고 있어요.`);}},

 ]},
{id:'m1u7',sem:'2학기',title:'덧셈과 뺄셈(1)',goal:'받아올림·받아내림이 없는 두 자리 수의 덧셈과 뺄셈을 해요.',

{id:'m1u9',sem:'2학기',title:'덧셈과 뺄셈(2)',goal:'세 수의 덧셈과 뺄셈, 10이 되는 더하기와 10에서 빼기를 해요.',
 concept:[
  {t:'세 수의 계산',h:`<p>앞에서부터 차례로 두 수씩 계산해요.</p>${exb('2 + 3 + 4 → 5 + 4 → <b>9</b>')}${exb('9 - 2 - 3 → 7 - 3 → <b>4</b>')}`},
  {t:'10이 되는 짝꿍',h:`${tableHTML(['1+9','2+8','3+7','4+6','5+5'],[['10','10','10','10','10']])}${exb('10 - 4 = 6, &nbsp; 10 - 7 = 3')}`},
  {t:'10을 만들어 더하기',h:`${exb('7 + 3 + 5 → (7 + 3) + 5 → 10 + 5 = <b>15</b>')}${tip('더해서 10이 되는 두 수를 먼저 찾아 더하면 빨라요.')}`}
 ],
 gens:[
  {k:'calc',w:3,f(){const a=R(1,5),b=R(1,4),c=R(1,9-a-b>0?9-a-b:1);if(a+b+c>9)return null;return EQ(`${a} + ${b} + ${c}`,a+b+c,`${a}+${b}=${a+b}, ${a+b}+${c}=${a+b+c}`);}},
  {k:'calc',w:3,f(){const a=R(5,9),b=R(1,a-1),c=R(0,a-b);return EQ(`${a} - ${b} - ${c}`,a-b-c,`${a}-${b}=${a-b}, ${a-b}-${c}=${a-b-c}`);}},
  {k:'calc',w:3,f(){const a=R(1,9);return C(`<span class="big">${a} + □ = 10</span>`,10-a,`${a}와(과) ${10-a}는 10이 되는 짝꿍`);}},
  {k:'calc',w:2,f(){const a=R(1,9);return EQ(`10 - ${a}`,10-a,`${a}+${10-a}=10 이므로 10-${a}=${10-a}`);}},
  {k:'calc',w:3,f(){const a=R(1,9),c=R(1,9);return EQ(`${a} + ${10-a} + ${c}`,10+c,`${a}+${10-a}=10, 10+${c}=${10+c}`);}},
  {k:'word',w:3,f(){const a=R(1,4),b=R(1,3),c=R(1,9-a-b);const who=nm();return W(`${J(who,'은는')} 사탕을 아침에 ${a}개, 점심에 ${b}개, 저녁에 ${c}개 먹었어요. 하루 동안 먹은 사탕은 모두 몇 개일까요?`,a+b+c,'개',`${a}+${b}+${c}=${a+b+c}`);}},
  {k:'word',w:3,f(){const n=R(6,9),a=R(1,3),b=R(1,n-a-1);return W(`버스에 ${n}명이 타고 있었어요. 첫 번째 정류장에서 ${a}명, 두 번째 정류장에서 ${b}명이 내렸어요. 버스에 남은 사람은 몇 명일까요?`,n-a-b,'명',`${n}-${a}-${b}=${n-a-b}`);}},
  {k:'word',w:2,f(){const a=R(1,9),who=nm();return W(`${J(who,'은는')} 붙임딱지 10장 중에서 ${a}장을 썼어요. 남은 붙임딱지는 몇 장일까요?`,10-a,'장',`10-${a}=${10-a}`);}},
  {k:'word',w:2,f(){const a=R(2,8),c=R(1,8);return W(`빨간 공 ${a}개, 파란 공 ${10-a}개, 노란 공 ${c}개가 있어요. 공은 모두 몇 개일까요?`,10+c,'개',`빨간 공과 파란 공을 먼저 더하면 10, 10+${c}=${10+c}`,{extra:{hint:'10이 되는 두 수를 먼저 찾아 보세요.'}});}},
  {k:'word',w:1,f(){const a=R(1,4),b=R(1,4);const c=9-a-b;if(c<1)return null;return W(`세 수를 더해서 9가 되었어요. 두 수가 ${a}와(과) ${b}라면 나머지 한 수는 얼마일까요?`,c,'',`${a}+${b}+□=9 → □=${c}`);}}
 ]},
{id:'m1u10',sem:'2학기',title:'규칙 찾기',goal:'모양과 수의 배열에서 규칙을 찾아 말하고, 다음에 올 것을 알아요.',
 concept:[
  {t:'반복되는 규칙',h:`${exb('🍎🍌🍎🍌🍎🍌 → 사과, 바나나가 <b>반복</b>돼요.')}${exb('⭐⭐🌙⭐⭐🌙 → 별, 별, 달이 반복돼요.')}`},
  {t:'수의 규칙',h:`${exb('2, 4, 6, 8, 10 → 2씩 커져요.')}${exb('30, 27, 24, 21 → 3씩 작아져요.')}${tip('이웃한 두 수의 차이를 살펴보면 규칙이 보여요.')}`},
  {t:'수 배열표',h:`${tableHTML(['51','52','53','54','55'],[['61','62','63','64','65'],['71','72','73','74','75']])}<p>→ 방향으로 1씩, ↓ 방향으로 10씩 커져요.</p>`}
 ],
 gens:[
  {k:'calc',w:3,f(){const pats=[[0,1],[0,1,2],[0,0,1],[0,1,1],[0,1,2,1]];const p=pick(pats);const em=sample(['🍎','🍌','⭐','🌙','🐶','🐱','🔺','🟦','❤️','💛'],3);const seq=[];for(let i=0;i<p.length*2+R(0,p.length-1);i++)seq.push(em[p[i%p.length]]);const ans=em[p[seq.length%p.length]];
    return MC('calc',`규칙에 따라 다음에 올 것은?<div class="emo">${seq.join(' ')} ❓</div>`,ans,em.filter(x=>x!==ans).slice(0,2).concat(em.filter(x=>x===ans)).filter(x=>x!==ans),`${p.map(i=>em[i]).join('')}이(가) 반복돼요.`);}},
  {k:'calc',w:3,f(){const st=R(1,5),dn=Math.random()<.4,a=dn?R(st*5,60):R(1,40);const seq=range(0,4).map(i=>dn?a-st*i:a+st*i);const hole=R(2,4);return C(`규칙을 찾아 □에 알맞은 수를 쓰세요.<br><span class="big">${seq.map((v,i)=>i===hole?'□':v).join(', ')}</span>`,seq[hole],`${st}씩 ${dn?'작아져요':'커져요'}.`);}},
  {k:'calc',w:2,f(){const s=R(2,7)*10+R(1,5);return C(`수 배열표의 일부예요. ★에 알맞은 수는?${tableHTML([s,s+1,s+2],[[s+10,s+11,'★']])}`,s+12,`→ 1씩, ↓ 10씩 커져요.`);}},
  {k:'word',w:2,f(){const p=pick([['짝','짝','쿵'],['쿵','짝'],['쿵','쿵','짝']]);const n=R(p.length+2,10);const ans=p[(n-1)%p.length];return MC('word',`‘${p.join('-')}’을(를) 반복해서 박수를 쳐요. ${n}번째에는 무엇을 할까요?`,ans,p.includes('짝')&&p.includes('쿵')?[ans==='짝'?'쿵':'짝']:['짝'],`${p.join(', ')}이(가) ${p.length}개씩 반복 → ${n}번째는 ${ans}`);}},
  {k:'word',w:2,f(){const st=R(2,5),a=R(1,10),k=R(4,6);return W(`${J(nm(),'은는')} 첫째 날 ${a}쪽, 그다음 날부터는 전날보다 ${st}쪽씩 더 많이 읽기로 했어요. ${ORD[k]} 날에는 몇 쪽을 읽을까요?`,a+st*(k-1),'쪽',`${range(0,k-1).map(i=>a+st*i).join(' → ')}`);}},
  {k:'word',w:1,f(){const c=pick(['빨간','파란']),o=c==='빨간'?'파란':'빨간';const n=R(8,15);const red=Math.ceil(n/2);return W(`구슬을 ${c} 구슬, ${o} 구슬 순서로 번갈아 ${n}개 꿰었어요. ${c} 구슬은 몇 개일까요?`,red,'개',`1, 3, 5…번째가 ${c} 구슬 → ${red}개`);}}
 ]},
{id:'m1u11',sem:'2학기',title:'덧셈과 뺄셈(3)',goal:'받아올림이 있는 (몇)+(몇)과 받아내림이 있는 (십몇)-(몇)을 해요.',
 concept:[
  {t:'10을 만들어 더하기',h:`${exb('8 + 5 → 8에 2를 더해 10, 남은 3 → 10 + 3 = <b>13</b>')}<p>5를 2와 3으로 가르는 게 비법이에요!</p>`},
  {t:'10을 이용해 빼기',h:`${exb('13 - 5 → 13을 10과 3으로 가르기 → 10 - 5 = 5, 5 + 3 = <b>8</b>')}${exb('13 - 5 → 5를 3과 2로 가르기 → 13 - 3 = 10, 10 - 2 = <b>8</b>')}`},
  {t:'덧셈표 보기',h:`${tip('9 + 6 = 15, 8 + 7 = 15, 7 + 8 = 15 처럼 더하는 순서를 바꾸어도 합은 같아요.')}`}
 ],
 gens:[
  {k:'calc',w:4,f(){const a=R(2,9),b=R(11-a,9);if(a+b<11)return null;return EQ(`${a} + ${b}`,a+b,`${a}에 ${10-a}를 더해 10, 남은 ${b-(10-a)} → ${a+b}`);}},
  {k:'calc',w:4,f(){const a=R(11,18),b=R(a-9,9);if(b<=a%10)return null;return EQ(`${a} - ${b}`,a-b,`10-${b}=${10-b}, ${10-b}+${a%10}=${a-b}`);}},
  {k:'calc',w:2,f(){const a=R(3,9),c=R(11,a+9);return C(`<span class="big">${a} + □ = ${c}</span>`,c-a,`${c}-${a}=${c-a}`);}},
  {k:'calc',w:2,f(){const a=R(11,17),b=R(2,9);if(b<=a%10||a-b<1)return null;return MC('calc',`계산 결과가 다른 하나는?`,`${a} - ${b+1}`,[`${a} - ${b}`,`${a+1} - ${b+1}`,`${a-1} - ${b-1}`],`${a}-${b}=${a-b}인데 ${a}-${b+1}=${a-b-1}이에요.`);}},
  {k:'word',w:3,f(){const t=thing(),a=R(5,9),b=R(11-a,9),who=nm();if(a+b<11)return null;return W(`${J(who,'은는')} ${t.n} ${a}${J(t.u,'을를')} 가지고 있었는데, 친구에게 ${b}${J(t.u,'을를')} 더 받았어요. ${who}의 ${J(t.n,'은는')} 모두 몇 ${t.u}일까요?`,a+b,t.u,`식: ${a} + ${b} = ${a+b}`);}},
  {k:'word',w:3,f(){const a=R(11,18),b=R(a-9,9);if(b<=a%10)return null;return W(`바구니에 귤이 ${a}개 있었어요. 가족이 ${b}개를 먹었어요. 남은 귤은 몇 개일까요?`,a-b,'개',`식: ${a} - ${b} = ${a-b}`);}},
  {k:'word',w:2,f(){const [p,q]=names(2);const a=R(11,18),b=R(a-9,9);if(b<=a%10)return null;return W(`${J(p,'은는')} 칭찬 붙임딱지를 ${a}장, ${J(q,'은는')} ${b}장 모았어요. 누가 몇 장 더 많이 모았는지 구해 보세요. ${J(p,'은는')} 몇 장 더 많이 모았을까요?`,a-b,'장',`${a}-${b}=${a-b}`);}},
  {k:'word',w:2,f(){const a=R(6,9),b=R(5,9),c=R(2,a+b-10);return W(`운동장에 남자 어린이 ${a}명과 여자 어린이 ${b}명이 놀고 있었어요. 잠시 후 ${c}명이 집에 갔어요. 운동장에 남은 어린이는 몇 명일까요?`,a+b-c,'명',`${a}+${b}=${a+b}, ${a+b}-${c}=${a+b-c}`,{extra:{hint:'먼저 모두 몇 명인지 구해 보세요.'}});}},
  {k:'word',w:1,f(){const a=R(4,9),c=R(11,a+9);return W(`어떤 수에서 ${a}를 뺐더니 ${c-a}가 되었어요. 어떤 수는 얼마일까요?`,c,'',`□ - ${a} = ${c-a} → □ = ${c-a} + ${a} = ${c}`);}}
 ]}
]);

function placeQ(n,digits){const names=['일','십','백','천'];const s=String(n);const i=R(0,s.length-1);const d=+s[i];const pos=s.length-1-i;if(d===0)return null;
  return C(`<span class="big">${n}</span> 에서 숫자 <b>${d}</b>은(는) 어느 자리 숫자이고, 얼마를 나타낼까요? (나타내는 수를 쓰세요)`,d*10**pos,`${d}은(는) ${names[pos]}의 자리 숫자이고 ${fmt(d*10**pos)}을(를) 나타내요.`);}
addUnits(2,'math',[
{id:'m2u1',sem:'1학기',title:'세 자리 수',goal:'100을 알고, 세 자리 수의 자릿값, 뛰어 세기, 크기 비교를 해요.',
 concept:[
  {t:'백(100)',h:`<p>10이 10개이면 <b>100</b>이에요. 99보다 1 큰 수이기도 해요.</p>${tableHTML(['100이','2개','3개','5개','9개'],[['수','200','300','500','900'],['읽기','이백','삼백','오백','구백']])}`},
  {t:'자릿값',h:`${tableHTML(['백의 자리','십의 자리','일의 자리'],[['3','5','2'],['300','50','2']])}<p>352 = 300 + 50 + 2, 삼백오십이라고 읽어요.</p>${tip('0이 있는 자리는 읽지 않아요. 405 → 사백오')}`},
  {t:'뛰어 세기와 크기 비교',h:`${exb('100씩: 245 → 345 → 445 &nbsp; 10씩: 245 → 255 → 265')}<p>백의 자리부터 차례로 비교해요. 563 &gt; 536 (십의 자리 6 &gt; 3)</p>`}
 ],
 gens:[
  {k:'calc',w:3,f(){const a=R(1,9),b=R(0,9),c=R(0,9);return C(`100이 ${a}개, 10이 ${b}개, 1이 ${c}개인 수는?`,a*100+b*10+c,`${a*100}+${b*10}+${c}`);}},
  {k:'calc',w:2,f(){const n=R(101,999);return placeQ(n);}},
  {k:'calc',w:2,f(){const n=R(101,999);const r=sinoRead(n);return MC('calc',`<span class="big">${n}</span> 을(를) 바르게 읽은 것은?`,r,[sinoRead(n+10>999?n-10:n+10),sinoRead(+String(n).split('').reverse().join('')||n+1),sinoRead(n+100>999?n-100:n+100)],`${n} → ${r}`);}},
  {k:'calc',w:2,f(){const st=pick([1,10,100]),a=R(100,999-st*4);const seq=range(0,4).map(i=>a+st*i);const h=R(1,4);return C(`${st}씩 뛰어 세었어요. □에 알맞은 수는?<br><span class="big">${seq.map((v,i)=>i===h?'□':v).join(' → ')}</span>`,seq[h],`${st}씩 커져요.`);}},
  {k:'calc',w:2,f(){const a=R(100,999);let b=a+pick([-100,-10,-1,1,10,100,R(-90,90)]);if(b<100||b>999||b===a)return null;return MC('calc',`<span class="big">${a} ○ ${b}</span> 에서 ○에 알맞은 것은?`,a>b?'&gt;':'&lt;',[a>b?'&lt;':'&gt;'],`백의 자리부터 차례로 비교해요.`,{ordered:['&gt;','&lt;']});}},
  {k:'word',w:3,f(){const a=R(1,6),b=R(0,9),c=R(0,9);const who=nm();return W(`${J(who,'은는')} 저금통에 100원짜리 동전 ${a}개, 10원짜리 동전 ${b}개, 1원짜리 동전 ${c}개를 모았어요. 모은 돈은 모두 얼마일까요?`,a*100+b*10+c,'원',`${a*100}+${b*10}+${c}=${a*100+b*10+c}원`);}},
  {k:'word',w:3,f(){const ds=sample(range(1,9),3);const big=Math.random()<.5;const s=[...ds].sort((x,y)=>big?y-x:x-y).join('');return W(`숫자 카드 ${ds.map(d=>`[${d}]`).join(' ')}를 한 번씩만 사용하여 만들 수 있는 가장 ${big?'큰':'작은'} 세 자리 수는?`,+s,'',`${big?'큰':'작은'} 숫자부터 백의 자리에 놓아요 → ${s}`,{extra:{hint:'백의 자리에 어떤 숫자가 와야 할지 생각해 보세요.'}});}},
  {k:'word',w:2,f(){const a=R(2,7)*100+R(0,99),k=R(2,4);return W(`어떤 수에서 100씩 ${k}번 뛰어 세었더니 ${a+100*k}이(가) 되었어요. 어떤 수는?`,a,'',`${a+100*k}에서 100씩 ${k}번 거꾸로 → ${a}`);}},
  {k:'word',w:1,f(){const h=R(1,8),t=R(1,9);const lo=h*100+t*10,hi=lo+9;return W(`백의 자리 숫자가 ${h}, 십의 자리 숫자가 ${t}인 세 자리 수 중에서 ${lo+4}보다 큰 수는 모두 몇 개일까요?`,hi-(lo+4),'개',`${lo+5}부터 ${hi}까지 → ${hi-lo-4}개`);}}
 ]},
{id:'m2u2',sem:'1학기',title:'여러 가지 도형',goal:'삼각형, 사각형, 오각형, 육각형, 원을 알고 변과 꼭짓점을 세어요.',
 concept:[
  {t:'도형의 이름',h:`<div class="row">${polySVG(3,70,'#FF8FA3')}${polySVG(4,70,'#FFD23F',Math.PI/4)}${polySVG(5,70,'#4DA8FF')}${polySVG(6,70,'#2FCB82')}${polySVG(0,70,'#C9B6FF')}</div>${tableHTML(['도형','삼각형','사각형','오각형','육각형','원'],[['변','3','4','5','6','없음'],['꼭짓점','3','4','5','6','없음']])}`},
  {t:'변과 꼭짓점',h:`<p>도형을 이루는 곧은 선을 <b>변</b>, 두 변이 만나는 점을 <b>꼭짓점</b>이라고 해요.</p>${tip('원은 어느 쪽에서 보아도 똑같이 동그랗고, 곧은 선과 꼭짓점이 없어요.')}`},
  {t:'쌓기나무',h:`<p>쌓기나무로 모양을 만들 때는 위치(오른쪽, 왼쪽, 앞, 뒤, 위)를 말로 설명해요.</p>`}
 ],
 gens:(()=>{const NM={3:'삼각형',4:'사각형',5:'오각형',6:'육각형',0:'원'};return [
  {k:'calc',w:3,f(){const n=pick([3,4,5,6,0]);return MC('calc','이 도형의 이름은?',NM[n],Object.values(NM).filter(x=>x!==NM[n]),n?`변이 ${n}개 → ${NM[n]}`:'곧은 선이 없고 동그란 모양 → 원',{extra:{fig:polySVG(n,110,pick(['#FF8FA3','#FFD23F','#4DA8FF','#2FCB82']),n===4?Math.PI/4:R(0,3)*.2)}});}},
  {k:'calc',w:3,f(){const n=pick([3,4,5,6]);const w=pick(['변','꼭짓점']);return C(`${NM[n]}의 ${w}은(는) 몇 개일까요?`,n,`${NM[n]}은(는) 변과 꼭짓점이 ${n}개씩이에요.`,{u:'개',extra:{fig:polySVG(n,100,'#FFD23F',n===4?Math.PI/4:0)}});}},
  {k:'calc',w:2,f(){const qs=[['원에는 꼭짓점이 없어요.',true],['삼각형은 변이 4개예요.',false],['육각형은 꼭짓점이 6개예요.',true],['사각형의 변과 꼭짓점의 수는 같아요.',true],['원에는 곧은 선이 1개 있어요.',false],['오각형은 변이 5개예요.',true],['모든 삼각형은 크기가 같아요.',false]];const [q,t]=pick(qs);return OX('calc',q,t,t?'맞는 설명이에요.':'틀린 설명이에요.');}},
  {k:'word',w:3,f(){const a=R(1,5),b=R(1,4),[x,y]=sample([3,4,5,6],2);return W(`${NM[x]} ${a}개와 ${NM[y]} ${b}개가 있어요. 꼭짓점은 모두 몇 개일까요?`,a*x+b*y,'개',`${NM[x]} ${a}개 → ${a*x}개, ${NM[y]} ${b}개 → ${b*y}개, 합 ${a*x+b*y}개`);}},
  {k:'word',w:2,f(){const n=pick([3,4,5,6]);const k=R(2,4);return W(`어떤 도형 ${k}개의 변을 모두 세었더니 ${n*k}개였어요. 이 도형은 무엇일까요? (도형의 이름)`,NM[n],'',`${n*k} ÷ ${k} = 한 도형의 변 ${n}개 → ${NM[n]}`,{extra:{fields:[{a:[NM[n]],w:'wide'}]}});}},

{id:'m2u3',sem:'1학기',title:'덧셈과 뺄셈',goal:'받아올림·받아내림이 있는 두 자리 수의 덧셈과 뺄셈을 하고, □의 값을 구해요.',
 concept:[
  {t:'받아올림이 있는 덧셈',h:`${exb('38 + 25 → 일의 자리 8+5=13 → 3을 쓰고 10은 십의 자리로 받아올림 → 십의 자리 1+3+2=6 → <b>63</b>')}`},
  {t:'받아내림이 있는 뺄셈',h:`${exb('52 - 27 → 일의 자리 2에서 7을 뺄 수 없으니 십의 자리에서 10을 빌려와 12-7=5 → 십의 자리 4-2=2 → <b>25</b>')}`},
  {t:'□가 있는 식',h:`${exb('□ + 18 = 45 → □ = 45 - 18 = 27')}${exb('52 - □ = 26 → □ = 52 - 26 = 26')}${tip('덧셈과 뺄셈은 서로 거꾸로 하는 계산이에요.')}`}
 ],
 gens:[
  {k:'calc',w:4,f(){const a=R(15,79),b=R(11,99-a);if((a%10)+(b%10)<10)return null;return EQ(`${a} + ${b}`,a+b,`일의 자리 ${a%10}+${b%10}=${a%10+b%10} → 받아올림`);}},
  {k:'calc',w:4,f(){const a=R(30,99),b=R(11,a-1);if(b%10<=a%10)return null;return EQ(`${a} - ${b}`,a-b,`일의 자리에서 받아내림 → ${a-b}`);}},
  {k:'calc',w:2,f(){const a=R(12,60),c=R(a+11,99);return C(`<span class="big">□ + ${a} = ${c}</span>`,c-a,`□ = ${c} - ${a} = ${c-a}`);}},
  {k:'calc',w:2,f(){const a=R(40,95),b=R(12,a-10);return C(`<span class="big">${a} - □ = ${a-b}</span>`,b,`□ = ${a} - ${a-b} = ${b}`);}},
  {k:'calc',w:2,f(){const a=R(10,40),b=R(10,30),c=R(5,a+b-1);return EQ(`${a} + ${b} - ${c}`,a+b-c,`앞에서부터: ${a+b} - ${c} = ${a+b-c}`);}},
  {k:'word',w:3,f(){const t=thing(),a=R(18,60),b=R(14,99-a),who=nm();if((a%10)+(b%10)<10)return null;return W(`${J(who,'은는')} ${t.n} ${a}${J(t.u,'을를')} 가지고 있었어요. 할머니께 ${b}${J(t.u,'을를')} 더 받았어요. 모두 몇 ${t.u}이(가) 되었을까요?`,a+b,t.u,`식: ${a} + ${b} = ${a+b}`);}},
  {k:'word',w:3,f(){const a=R(40,92),b=R(15,a-10);if(b%10<=a%10)return null;return W(`과수원에서 사과를 ${a}개 땄어요. 그중 ${b}개를 이웃에게 나누어 주었어요. 남은 사과는 몇 개일까요?`,a-b,'개',`식: ${a} - ${b} = ${a-b}`);}},
  {k:'word',w:3,f(){const a=R(12,40),wrong=R(30,50);const ans=wrong-a-a;if(ans<5)return null;const x=wrong-a;return W(`어떤 수에서 ${a}를 빼야 할 것을 잘못하여 더했더니 ${wrong}이(가) 되었어요. 바르게 계산하면 얼마일까요?`,x-a,'',`어떤 수: ${wrong} - ${a} = ${x} → 바른 계산: ${x} - ${a} = ${x-a}`,{extra:{hint:'먼저 어떤 수를 구해 보세요.'}});}},
  {k:'word',w:2,f(){const g1=R(15,30),bb=R(5,15),cc=R(5,15);return W(`버스에 ${g1}명이 타고 있었어요. 이번 정류장에서 ${bb}명이 내리고 ${cc}명이 탔어요. 지금 버스에 타고 있는 사람은 몇 명일까요?`,g1-bb+cc,'명',`${g1} - ${bb} + ${cc} = ${g1-bb+cc}`);}},
  {k:'word',w:2,f(){const [p,q]=names(2);const a=R(25,60),d=R(8,19);return W(`${J(p,'은는')} 딱지를 ${a}장 가지고 있고, ${J(q,'은는')} ${p}보다 ${d}장 더 적게 가지고 있어요. 두 사람이 가진 딱지는 모두 몇 장일까요?`,a+a-d,'장',`${q}: ${a}-${d}=${a-d}장, 합: ${a}+${a-d}=${a+a-d}장`);}}
 ]},
{id:'m2u4',sem:'1학기',title:'길이 재기',goal:'1cm를 알고 자로 길이를 재며, 길이를 어림해요.',
 concept:[

  {t:'자로 재는 방법',h:`<ul><li>물건의 한쪽 끝을 자의 눈금 0에 맞춰요.</li><li>다른 쪽 끝이 가리키는 눈금을 읽어요.</li><li>0이 아닌 곳에 맞추었다면 1cm가 몇 번 들어가는지 세어요.</li></ul>`},
  {t:'어림하기',h:`<p>자를 쓰지 않고 길이를 짐작하는 것을 어림이라고 해요. 어림한 길이는 ‘약 □cm’라고 말해요.</p>${exb('내 엄지손톱 폭은 약 1cm, 한 뼘은 약 12~15cm')}`}
 ],
 gens:[
  {k:'calc',w:3,f(){const L=R(2,8);return C(`파란 막대의 길이는 몇 cm일까요?`,L,`0부터 ${L}까지 → ${L}cm`,{u:'cm',extra:{fig:rulerSVG(L,0)}});}},
  {k:'calc',w:3,f(){const s=R(1,3),L=R(2,6);return C(`파란 막대의 길이는 몇 cm일까요?`,L,`${s}부터 ${s+L}까지 1cm가 ${L}번 → ${L}cm`,{u:'cm',extra:{fig:rulerSVG(L,s),hint:'시작하는 눈금이 0이 아니에요. 칸 수를 세어 보세요.'}});}},
  {k:'calc',w:2,f(){const it=[['연필','약 15cm'],['지우개','약 4cm'],['교과서 긴 쪽','약 26cm'],['클립','약 3cm'],['숟가락','약 18cm'],['색연필','약 17cm']];const [a,b]=pick(it);return MC('calc',`${a}의 길이로 알맞은 것은?`,b,it.filter(x=>x[1]!==b).map(x=>x[1]),`${a}는 ${b}예요.`);}},
  {k:'word',w:3,f(){const a=R(20,60),b=R(5,a-5);return W(`리본 ${a}cm 중에서 선물 상자를 묶는 데 ${b}cm를 사용했어요. 남은 리본은 몇 cm일까요?`,a-b,'cm',`${a} - ${b} = ${a-b}`);}},
  {k:'word',w:2,f(){const a=R(10,30),b=R(10,30);return W(`길이가 ${a}cm인 막대와 ${b}cm인 막대를 겹치지 않게 이어 붙였어요. 전체 길이는 몇 cm일까요?`,a+b,'cm',`${a} + ${b} = ${a+b}`);}},
  {k:'word',w:2,f(){const s=R(2,4),p=R(3,6);return W(`지우개의 길이는 클립 ${p}개를 이은 길이와 같아요. 클립 한 개가 ${s}cm라면 지우개의 길이는?`,s*p,'cm',`${s}cm가 ${p}번 → ${Array(p).fill(s).join('+')} = ${s*p}cm`);}},
  {k:'word',w:2,f(){const [p,q]=names(2);const real=R(10,25),a=real+R(-4,4),b=real+R(-4,4);if(Math.abs(a-real)===Math.abs(b-real))return null;return MC('word',`실제 길이가 ${real}cm인 끈을 ${J(p,'은는')} 약 ${a}cm, ${J(q,'은는')} 약 ${b}cm로 어림했어요. 누가 더 가깝게 어림했을까요?`,Math.abs(a-real)<Math.abs(b-real)?p:q,[Math.abs(a-real)<Math.abs(b-real)?q:p],`실제 길이와의 차: ${p} ${Math.abs(a-real)}cm, ${q} ${Math.abs(b-real)}cm`);}}
 ]},
{id:'m2u5',sem:'1학기',title:'분류하기',goal:'기준을 정해 분류하고, 분류한 결과를 세어 말해요.',
 concept:[
  {t:'분류란?',h:`<p>정해진 <b>기준</b>에 따라 같은 것끼리 나누는 것을 분류라고 해요.</p>${tip('기준은 누가 보아도 똑같이 나눌 수 있어야 해요. ‘예쁜 것’, ‘좋아하는 것’은 사람마다 달라서 기준이 될 수 없어요.')}`},
  {t:'세어 보고 비교하기',h:`${tableHTML(['색깔','빨강','파랑','노랑'],[['세면서 표시','////','///','//'],['수(개)','4','3','2']])}<p>분류해서 세어 보면 가장 많은 것과 가장 적은 것을 쉽게 알 수 있어요.</p>`}
 ],
 gens:(()=>{const COL={빨간색:'#FF5C5C',파란색:'#4DA8FF',노란색:'#FFD23F'};const SH={원:0,삼각형:3,사각형:4};
  function make(){const n=R(8,13);const items=[];for(let i=0;i<n;i++)items.push([pick(Object.keys(COL)),pick(Object.keys(SH))]);
    let b='';items.forEach((it,i)=>{const x=10+(i%7)*62,y=10+Math.floor(i/7)*62;const s=polySVG(SH[it[1]],54,COL[it[0]],SH[it[1]]===4?Math.PI/4:0).replace('<svg ',`<svg x="${x}" y="${y}" `);b+=s;});
    return {items,fig:svg(445,10+Math.ceil(n/7)*62,b)};}
  return [
  {k:'calc',w:3,f(){const {items,fig}=make();const c=pick(Object.keys(COL));const n=items.filter(i=>i[0]===c).length;return C(`${c} 도형은 몇 개일까요?`,n,`${c}만 세면 ${n}개`,{u:'개',extra:{fig}});}},
  {k:'calc',w:3,f(){const {items,fig}=make();const s=pick(Object.keys(SH));const n=items.filter(i=>i[1]===s).length;return C(`${s}은(는) 몇 개일까요?`,n,`${s}만 세면 ${n}개`,{u:'개',extra:{fig}});}},
  {k:'word',w:3,f(){const {items,fig}=make();const c=pick(Object.keys(COL)),s=pick(Object.keys(SH));const n=items.filter(i=>i[0]===c&&i[1]===s).length;return W(`${c}이면서 ${s}인 도형은 몇 개일까요?`,n,'개',`색깔과 모양 두 가지 기준을 모두 만족하는 것: ${n}개`,{extra:{fig}});}},
  {k:'word',w:2,f(){const {items,fig}=make();const cnt={};items.forEach(i=>cnt[i[0]]=(cnt[i[0]]||0)+1);const ks=Object.keys(COL).sort((a,b)=>(cnt[b]||0)-(cnt[a]||0));if((cnt[ks[0]]||0)===(cnt[ks[1]]||0))return null;return MC('word',`색깔로 분류했을 때 가장 많은 색깔은?`,ks[0],ks.slice(1),`${ks.map(k=>k+' '+(cnt[k]||0)+'개').join(', ')}`,{extra:{fig}});}},
  {k:'word',w:2,f(){const {items,fig}=make();const s=pick(Object.keys(SH));const n=items.filter(i=>i[1]!==s).length;return W(`${s}이 아닌 도형은 몇 개일까요?`,n,'개',`전체 ${items.length}개 - ${s} ${items.length-n}개 = ${n}개`,{extra:{fig}});}},
  {k:'calc',w:2,f(){const good=['색깔','모양','다리의 수','사는 곳(땅/물)','바퀴의 수'],bad=['예쁜 것과 예쁘지 않은 것','좋아하는 것과 싫어하는 것','멋진 것과 멋지지 않은 것'];return MC('calc','분류하는 기준으로 알맞지 <b>않은</b> 것은?',pick(bad),sample(good,3),'사람마다 다르게 생각할 수 있는 기준은 알맞지 않아요.');}}
 ];})()},

  {k:'word',w:3,f(){const a=R(2,6),b=R(2,5);const [p,q]=names(2);return W(`${J(p,'은는')} 구슬을 ${a}개 가지고 있고, ${J(q,'은는')} ${p}의 ${b}배만큼 가지고 있어요. ${J(q,'은는')} 구슬을 몇 개 가지고 있을까요?`,a*b,'개',`${a}의 ${b}배 → ${a}×${b}=${a*b}`);}},
  {k:'word',w:2,f(){const n=R(2,6);return W(`세발자전거 ${n}대의 바퀴는 모두 몇 개일까요?`,3*n,'개',`3씩 ${n}묶음 → 3×${n}=${3*n}`);}},
  {k:'word',w:2,f(){const a=R(2,5),b=R(2,4),c=R(1,a*b-1);return W(`한 상자에 ${a}개씩 들어 있는 초콜릿 ${b}상자를 샀어요. 그중 ${c}개를 먹었다면 남은 초콜릿은 몇 개일까요?`,a*b-c,'개',`${a}×${b}=${a*b}, ${a*b}-${c}=${a*b-c}`);}}
 ]},

 ],

{id:'m2u9',sem:'2학기',title:'길이 재기 (m)',goal:'1m를 알고, m와 cm를 바꾸어 나타내며 길이의 합과 차를 구해요.',

{id:'m3u12',sem:'2학기',title:'자료의 정리',goal:'자료를 표와 그림그래프로 나타내고 해석해요.',
 concept:[
  {t:'그림그래프',h:`<p>알려고 하는 수(조사한 수)를 그림으로 나타낸 그래프예요. 큰 그림과 작은 그림으로 단위를 나누어 나타내요.</p>${tableHTML(['마을','나무 수'],[['가',`<span style="font-size:26px">🌳🌳</span><span style="font-size:14px">🌳🌳🌳</span>`],['나',`<span style="font-size:26px">🌳</span><span style="font-size:14px">🌳🌳🌳🌳🌳</span>`]])}<p>큰 🌳 = 10그루, 작은 🌳 = 1그루 → 가 마을 23그루, 나 마을 15그루</p>`},
  {t:'그림그래프의 좋은 점',h:`<p>그림의 크기와 개수로 많고 적음을 한눈에 비교할 수 있어요.</p>`}
 ],
 gens:(()=>{const T=[['마을별 사과 생산량','🍎','상자',['가','나','다','라']],['반별 모은 빈 병','🍾','병',['1반','2반','3반','4반']],['가게별 팔린 아이스크림','🍦','개',['해님','달님','별님','구름']],['농장별 기르는 닭','🐔','마리',['푸른','맑은','밝은','고운']]];
  function data(big=10){const [t,e,u,k]=pick(T);let v;do{v=k.map(()=>R(1,5)*big+R(0,9)*(big/10));}while(new Set(v).size<k.length);return {t,e,u,k,v,big};}
  const pg=d=>{const sm=d.big/10;return `${tableHTML(['이름',d.t],d.k.map((k,i)=>{const B=Math.floor(d.v[i]/d.big),S=Math.round((d.v[i]%d.big)/sm);return [k,`<span style="font-size:26px">${d.e.repeat(B)}</span><span style="font-size:14px">${d.e.repeat(S)}</span>`];}))}<p style="font-size:14px;margin:4px 0 0">큰 그림 ${d.e} = ${d.big}${d.u}, 작은 그림 ${d.e} = ${sm}${d.u}</p>`;};
  return [
  {k:'calc',w:3,f(){const d=data(pick([10,100]));const i=R(0,3);return C(`${pg(d)}${d.k[i]}의 ${d.u==='상자'?'생산량':'수'}은(는) 몇 ${d.u}일까요?`,d.v[i],`큰 그림 ${Math.floor(d.v[i]/d.big)}개, 작은 그림 ${(d.v[i]%d.big)/(d.big/10)}개`,{u:d.u});}},
  {k:'calc',w:2,f(){const d=data();const mx=Math.max(...d.v);return MC('calc',`${pg(d)}가장 많은 곳은?`,d.k[d.v.indexOf(mx)],d.k.filter((x,i)=>d.v[i]!==mx),'큰 그림이 가장 많은 곳을 찾아요.');}},
  {k:'word',w:3,f(){const d=data();const [i,j]=sample([0,1,2,3],2);const [a,b]=d.v[i]>d.v[j]?[i,j]:[j,i];return W(`${pg(d)}${d.k[a]}은(는) ${d.k[b]}보다 몇 ${d.u} 더 많을까요?`,d.v[a]-d.v[b],d.u,`${d.v[a]} - ${d.v[b]} = ${d.v[a]-d.v[b]}`);}},
  {k:'word',w:2,f(){const d=data();const s=d.v.reduce((a,b)=>a+b,0);return W(`${pg(d)}네 곳을 모두 합하면 몇 ${d.u}일까요?`,s,d.u,`${d.v.join('+')} = ${s}`);}},
  {k:'word',w:2,f(){const d=data();const i=R(0,3);const price=pick([2,3,5])*1000;return W(`${pg(d)}${d.k[i]}의 ${d.e} 1${d.u}를 ${fmt(price)}원에 판다면 모두 얼마일까요?`,d.v[i]*price,'원',`${d.v[i]} × ${price} = ${d.v[i]*price}`);}}
 ];})()}
]);

function bigRead(n){const units=['','만','억','조'];let s='',i=0;while(n>0){const p=n%10000;if(p)s=(p===1&&i===1?'':p===1&&i>1?'일':sinoRead(p))+units[i]+(s?' '+s:'');n=Math.floor(n/10000);i++;}return s||'영';}

 concept:[
  {t:'만',h:`<p>1000이 10개이면 <b>10000</b> (만 또는 일만)이에요.</p>${tableHTML(['천만','백만','십만','만','천','백','십','일'],[['3','5','2','8','4','0','0','0']])}<p>35284000 → 삼천오백이십팔만 사천</p>`},
  {t:'억과 조',h:`${exb('1000만이 10개 → 1억 (100000000, 0이 8개)')}${exb('1000억이 10개 → 1조 (0이 12개)')}${tip('큰 수는 오른쪽에서부터 네 자리씩 끊어 읽으면 쉬워요. 2,5000,0000 → 2억 5000만')}`},
  {t:'뛰어 세기와 크기 비교',h:`${exb('10만씩: 350만 → 360만 → 370만')}<p>자릿수가 많은 수가 더 커요. 자릿수가 같으면 가장 높은 자리부터 비교해요.</p>`}
 ],
 gens:[
  {k:'calc',w:3,f(){const a=R(1,9999),b=R(0,9999);const n=a*10000+b;return C(`만이 ${a}개, 일이 ${b}개인 수를 숫자로 쓰세요.`,n,`${bigRead(n)}`,{extra:{fields:[{a:[String(n),fmt(n)],w:'wide'}]}});}},
  {k:'calc',w:3,f(){const n=R(1000,99999)*10000*pick([1,10,100])+R(0,9999);return MC('calc',`<span class="big">${fmt(n)}</span><br>을(를) 바르게 읽은 것은?`,bigRead(n),[bigRead(n*10),bigRead(Math.floor(n/10)),bigRead(n+10000*R(1,9))],`네 자리씩 끊어 읽어요.`);}},
  {k:'calc',w:2,f(){const s=String(R(10000000,999999999));const i=R(0,s.length-5);const d=+s[i];if(!d)return null;const pos=s.length-1-i;const nm2=['일','십','백','천','만','십만','백만','천만','억'];return C(`<span class="big">${fmt(+s)}</span> 에서 숫자 ${d}이(가) 나타내는 값은?`,d*10**pos,`${d}은(는) ${nm2[pos]}의 자리 숫자 → ${fmt(d*10**pos)}`,{extra:{fields:[{a:[String(d*10**pos),fmt(d*10**pos)],w:'wide'}]}});}},
  {k:'calc',w:2,f(){const st=pick([10000,100000,1000000,10000000]),a=R(1,90)*st+R(0,9)*st/10;const seq=range(0,3).map(i=>a+st*i);const h=R(1,3);return C(`${bigRead(st)}씩 뛰어 세었어요. □에 알맞은 수는?<br><b>${seq.map((v,i)=>i===h?'□':fmt(v)).join(' → ')}</b>`,seq[h],`${bigRead(st)}씩 커져요.`,{extra:{fields:[{a:[String(seq[h]),fmt(seq[h])],w:'wide'}]}});}},
  {k:'calc',w:2,f(){const a=R(100000,9999999),b=a+pick([1,-1])*R(1,9)*10**R(2,5);if(b<=0)return null;return MC('calc',`<span class="big">${fmt(a)} ○ ${fmt(b)}</span>`,a>b?'&gt;':'&lt;',[a>b?'&lt;':'&gt;'],'높은 자리부터 비교해요.',{ordered:['&gt;','&lt;']});}},
  {k:'word',w:3,f(){const a=R(1,9),b=R(1,9),c=R(1,9);const t=a*1000000+b*100000+c*10000;return W(`100만 원짜리 수표 ${a}장, 10만 원짜리 수표 ${b}장, 만 원짜리 지폐 ${c}장은 모두 얼마일까요?`,t,'원',`${bigRead(t)} 원`,{extra:{fields:[{a:[String(t),fmt(t)],u:'원',w:'wide'}]}});}},
  {k:'word',w:2,f(){const s=R(10,50)*10000,m=R(2,6)*10000,k=R(3,8);return W(`${J(nm(),'은는')} 통장에 ${fmt(s)}원이 있어요. 한 달에 ${fmt(m)}원씩 저금하면 ${k}개월 뒤에는 얼마가 될까요?`,s+m*k,'원',`${fmt(m)}씩 ${k}번 뛰어 세기 → ${fmt(s+m*k)}원`,{extra:{fields:[{a:[String(s+m*k),fmt(s+m*k)],u:'원',w:'wide'}]}});}},
  {k:'word',w:1,f(){return MC('word','1억은 1000만의 몇 배일까요?','10배',['100배','1000배','10000배'],'1000만이 10개이면 1억이에요.');}}
 ]},
{id:'m4u2',sem:'1학기',title:'각도',goal:'각도의 단위(도)를 알고, 예각과 둔각, 각도의 합과 차, 삼각형·사각형의 각의 합을 알아요.',
 concept:[
  {t:'각도와 각도기',h:`<p>직각을 똑같이 90으로 나눈 하나를 <b>1도(1°)</b>라고 해요. 직각은 90°예요.</p><p>각도기의 중심을 각의 꼭짓점에, 밑금을 한 변에 맞추고 다른 변이 가리키는 눈금을 읽어요.</p>`},
  {t:'예각과 둔각',h:`<div class="row">${angleSVG(50,120)}${angleSVG(90,120)}${angleSVG(130,120)}</div>${tableHTML(['예각','직각','둔각'],[['0°보다 크고 90°보다 작은 각','90°','90°보다 크고 180°보다 작은 각']])}`},
  {t:'각의 합',h:`${exb('삼각형의 세 각의 크기의 합 = <b>180°</b>')}${exb('사각형의 네 각의 크기의 합 = <b>360°</b>')}${exb('직선이 이루는 각 = 180°')}`}
 ],
 gens:[
  {k:'calc',w:3,f(){const d=pick([R(20,80),90,R(100,165)]);const t=d<90?'예각':d===90?'직각':'둔각';return MC('calc','이 각은 예각, 직각, 둔각 중 어느 것일까요?',t,['예각','직각','둔각'].filter(x=>x!==t),`${t}이에요.`,{extra:{fig:angleSVG(d,170)}});}},
  {k:'calc',w:3,f(){const a=R(15,120),b=R(15,170-a);return C(`<span class="big">${a}° + ${b}°</span>`,a+b,'',{u:'°'});}},
  {k:'calc',w:3,f(){const a=R(60,170),b=R(10,a-10);return C(`<span class="big">${a}° - ${b}°</span>`,a-b,'',{u:'°'});}},
  {k:'calc',w:3,f(){const a=R(25,100),b=R(20,155-a);return C(`삼각형의 두 각이 ${a}°, ${b}°예요. 나머지 한 각의 크기는?`,180-a-b,`180° - ${a}° - ${b}° = ${180-a-b}°`,{u:'°'});}},
  {k:'calc',w:2,f(){const a=R(60,120),b=R(60,120),c=R(50,120);const d=360-a-b-c;if(d<30||d>170)return null;return C(`사각형의 세 각이 ${a}°, ${b}°, ${c}°예요. 나머지 한 각의 크기는?`,d,`360° - ${a}° - ${b}° - ${c}° = ${d}°`,{u:'°'});}},
  {k:'calc',w:2,f(){const a=R(20,160);return C(`직선 위에서 한 각이 ${a}°일 때, 그 옆의 각(□)은 몇 도일까요?`,180-a,`직선은 180° → 180° - ${a}°`,{u:'°',extra:{fig:svg(240,110,`<line x1="10" y1="90" x2="230" y2="90" stroke="${INK}" stroke-width="3"/><line x1="120" y1="90" x2="${120+Math.cos(a*Math.PI/180)*90}" y2="${90-Math.sin(a*Math.PI/180)*90}" stroke="${INK}" stroke-width="3"/><text x="${a<90?150:150}" y="80" font-size="14" fill="${INK}">${a}°</text><text x="70" y="80" font-size="16" fill="#FF5C5C">□</text>`)}});}},
  {k:'word',w:2,f(){const h=pick([1,2,3,4,5,6]);return W(`시계가 ${h}시를 가리킬 때, 긴바늘과 짧은바늘이 이루는 작은 쪽의 각은 몇 도일까요?`,h*30,'°',`숫자 한 칸 = 30°, ${h}칸 → ${h*30}°`,{extra:{hint:'시계의 숫자 사이 한 칸은 360°÷12 = 30°예요.',fig:clockSVG(h,0,140)}});}},
  {k:'word',w:2,f(){const a=R(30,70);return W(`직각을 두 각으로 나누었어요. 한 각이 ${a}°이면 다른 한 각은 몇 도일까요?`,90-a,'°',`90° - ${a}° = ${90-a}°`);}},
  {k:'word',w:1,f(){const n=pick([2,3]);return W(`삼각형 ${n}개의 세 각의 크기를 모두 더하면 몇 도일까요?`,180*n,'°',`180° × ${n} = ${180*n}°`);}}
 ]},
{id:'m4u3',sem:'1학기',title:'곱셈과 나눗셈',goal:'(세 자리)×(두 자리), (세 자리)÷(두 자리)를 계산하고 문제를 해결해요.',
 concept:[
  {t:'(세 자리 수) × (두 자리 수)',h:`${exb('253 × 34<br>253 × 4 = 1012<br>253 × 30 = 7590<br>1012 + 7590 = <b>8602</b>')}`},
  {t:'(세 자리 수) ÷ (두 자리 수)',h:`${exb('745 ÷ 23 → 23 × 3 = 69 → 74 - 69 = 5, 55 ÷ 23 → 23 × 2 = 46 → 9<br>몫 <b>32</b>, 나머지 <b>9</b>')}${tip('몫을 어림해 보세요. 23은 약 20, 74 ÷ 20 ≈ 3')}`},
  {t:'검산',h:`${exb('23 × 32 + 9 = 745 ✔')}`}
 ],
 gens:[
  {k:'calc',w:4,f(){const a=R(101,999),b=R(11,99);return EQ(`${a} × ${b}`,a*b,`${a}×${b%10}=${a*(b%10)}, ${a}×${b-b%10}=${a*(b-b%10)}`);}},
  {k:'calc',w:3,f(){const b=R(12,49),q=R(2,9),r=R(0,b-1);return QR('calc',`<span class="big">${b*q+r} ÷ ${b}</span>`,b*q+r,b,`검산: ${b}×${q}+${r}=${b*q+r}`);}},
  {k:'calc',w:3,f(){const b=R(12,39),q=R(10,40),r=R(0,b-1);if(b*q+r>999)return null;return QR('calc',`<span class="big">${b*q+r} ÷ ${b}</span>`,b*q+r,b,`검산: ${b}×${q}+${r}=${b*q+r}`);}},
  {k:'calc',w:1,f(){const a=R(2,9)*100,b=R(2,9)*10;return EQ(`${a} × ${b}`,a*b,`${a/100}×${b/10}=${a*b/1000}에 0을 3개`);}},
  {k:'word',w:4,f(){const p=R(150,900),n=R(12,45);return W(`한 개에 ${p}원인 공책을 ${n}권 샀어요. 모두 얼마일까요?`,p*n,'원',`${p} × ${n} = ${p*n}`);}},
  {k:'word',w:3,f(){const b=R(12,30),q=R(5,30),r=R(1,b-1);if(b*q+r>999)return null;return W(`학생 ${b*q+r}명이 한 번에 ${b}명씩 탈 수 있는 케이블카를 타려고 해요. 모두 타려면 케이블카는 적어도 몇 번 운행해야 할까요?`,q+1,'번',`${b*q+r} ÷ ${b} = ${q} … ${r} → ${q+1}번`,{extra:{hint:'남는 사람도 타야 해요.'}});}},
  {k:'word',w:3,f(){const b=R(12,25),q=R(10,40),r=R(1,b-1);if(b*q+r>999)return null;return IN('word',`구슬 ${b*q+r}개를 한 상자에 ${b}개씩 담으려고 해요. 몇 상자가 되고 몇 개가 남을까요?`,[{a:q,u:'상자'},{a:r,pre:'남는 구슬',u:'개'}],`${b*q+r} ÷ ${b} = ${q} … ${r}`);}},
  {k:'word',w:2,f(){const s=R(120,400),d=R(15,30);return W(`하루에 ${s}mL씩 우유를 마셔요. ${d}일 동안 마시는 우유는 몇 mL일까요?`,s*d,'mL',`${s} × ${d} = ${s*d}`);}},
  {k:'word',w:2,f(){const b=R(13,40),q=R(5,24);const wrong=b*q;return W(`어떤 수에 ${b}을(를) 곱해야 할 것을 잘못하여 나누었더니 몫이 ${q}, 나머지가 0이었어요. 바르게 계산하면 얼마일까요?`,wrong*b,'',`어떤 수 = ${b}×${q} = ${wrong}, 바른 계산 ${wrong}×${b} = ${wrong*b}`);}}
 ]},
{id:'m4u4',sem:'1학기',title:'평면도형의 이동',goal:'평면도형을 밀기, 뒤집기, 돌리기 했을 때의 모양을 알아요.',
 concept:[
  {t:'밀기',h:`<p>도형을 어느 방향으로 밀어도 모양은 변하지 않고 위치만 바뀌어요.</p>`},
  {t:'뒤집기',h:`<div class="row">${fShape('id')} → 오른쪽으로 뒤집기 → ${fShape('fh')}</div><div class="row">${fShape('id')} → 아래쪽으로 뒤집기 → ${fShape('fv')}</div><p>왼쪽·오른쪽으로 뒤집으면 왼쪽과 오른쪽이, 위쪽·아래쪽으로 뒤집으면 위쪽과 아래쪽이 서로 바뀌어요.</p>`},
  {t:'돌리기',h:`<div class="row">${fShape('id')} → 시계 방향 90° → ${fShape('r90')} → 90° 더 → ${fShape('r180')}</div>${tip('시계 방향으로 360° 돌리면 처음 모양이 돼요. 시계 방향 90° = 시계 반대 방향 270°')}`}
 ],
 gens:[
  {k:'calc',w:4,f(){const t=pick(['r90','r180','r270','fh','fv']);const ws=sample(['r90','r180','r270','fh','fv','id'].filter(x=>x!==t),3);const ch=shuffle([t,...ws]);return {k:'calc',type:'mc',q:`왼쪽 도형을 <b>${TFN[t]}</b> 한 모양을 고르세요.`,fig:fShape('id',100,'#FFD23F'),choices:ch.map(x=>fShape(x)),a:ch.indexOf(t),ex:`${TFN[t]}의 결과예요.`};}},
  {k:'calc',w:2,f(){const t=pick(['r90','r180','fh','fv']);const ch=shuffle(['r90','r180','r270','fh','fv']).slice(0,4);if(!ch.includes(t))ch[0]=t;const s=shuffle(ch);return {k:'calc',type:'mc',q:`처음 도형이 오른쪽처럼 바뀌었어요. 어떻게 움직였을까요?<div class="row" style="justify-content:center">${fShape('id',90,'#FFD23F')} → ${fShape(t,90,'#FFD23F')}</div>`,choices:s.map(x=>TFN[x]),a:s.indexOf(t),ex:`${TFN[t]}`};}},
  {k:'calc',w:2,f(){const qs=[['시계 방향으로 90°만큼 4번 돌린 도형은 처음 도형과 같아요.',true],['도형을 밀면 모양이 바뀌어요.',false],['오른쪽으로 2번 뒤집은 도형은 처음 도형과 같아요.',true],['시계 방향으로 180° 돌린 도형과 시계 반대 방향으로 180° 돌린 도형은 같아요.',true],['시계 방향으로 90° 돌린 도형과 시계 반대 방향으로 90° 돌린 도형은 항상 같아요.',false]];const [q,t]=pick(qs);return OX('calc',q,t,'');}},
  {k:'word',w:3,f(){const rot={'0':'0','1':'1','2':'2','5':'5','6':'9','8':'8','9':'6'};const ds=['1','2','5','6','8','9'];let s='';for(let i=0;i<pick([2,3]);i++)s+=pick(ds);if(s[0]==='0')return null;const r=s.split('').reverse().map(c=>rot[c]).join('');return W(`숫자 카드 <span class="big">${s}</span> 를 시계 방향으로 180°만큼 돌렸을 때 만들어지는 수는? (디지털 숫자처럼 생각해요)`,r,'',`180° 돌리면 순서가 거꾸로 되고 6↔9가 바뀌어요 → ${r}`,{extra:{hint:'카드를 거꾸로 들고 읽는다고 생각해 보세요.'}});}},
  {k:'word',w:2,f(){const n=R(2,9);const eq=n%4;const nm3=['처음과 같은 모양','시계 방향으로 90° 돌린 모양','시계 방향으로 180° 돌린 모양','시계 방향으로 270° 돌린 모양'];return MC('word',`도형을 시계 방향으로 90°만큼 ${n}번 돌렸어요. 어떤 모양과 같을까요?`,nm3[eq],nm3.filter((x,i)=>i!==eq),`90° × ${n} = ${90*n}°, 360°마다 처음 모양 → ${nm3[eq]}`);}},
  {k:'word',w:2,f(){const x=R(2,6),dx=R(2,5),y=R(2,6),dy=R(1,4);return IN('word',`모눈 위의 점이 (가로 ${x}칸, 세로 ${y}칸)에 있어요. 이 점을 오른쪽으로 ${dx}칸, 위쪽으로 ${dy}칸 밀었어요. 점은 어디에 있을까요?`,[{a:x+dx,pre:'가로',u:'칸'},{a:y+dy,pre:'세로',u:'칸'}],`가로 ${x}+${dx}, 세로 ${y}+${dy}`);}}
 ]},
{id:'m4u5',sem:'1학기',title:'막대그래프',goal:'막대그래프를 읽고, 자료를 막대그래프로 나타내요.',
 concept:[
  {t:'막대그래프',h:`${barGraphSVG(['봄','여름','가을','겨울'],[6,9,4,3],'명',2,'좋아하는 계절')}<p>조사한 수를 막대 모양으로 나타낸 그래프예요. 가로는 항목, 세로는 수를 나타내요.</p>${tip('세로 눈금 한 칸이 몇을 나타내는지 먼저 확인해요!')}`},
  {t:'막대그래프의 좋은 점',h:`<p>표는 정확한 수를 알기 쉽고, 막대그래프는 수량의 많고 적음을 한눈에 비교하기 쉬워요.</p>`}
 ],
 gens:(()=>{const T=[['좋아하는 과목',['국어','수학','영어','과학','체육'],'명'],['반별 안경 쓴 학생',['1반','2반','3반','4반'],'명'],['요일별 도서관 방문자',['월','화','수','목','금'],'명'],['마을별 자전거 수',['가','나','다','라'],'대']];
  function data(){const [t,k,u]=pick(T);const step=pick([1,2,5]);let v;do{v=k.map(()=>R(1,8)*step);}while(new Set(v).size<k.length);return {t,k,u,v,step};}
  return [
  {k:'calc',w:3,f(){const d=data();const i=R(0,d.k.length-1);return C(`${d.k[i]}의 값은 몇 ${d.u}일까요?`,d.v[i],`세로 눈금 한 칸은 ${d.step}${d.u}`,{u:d.u,extra:{fig:barGraphSVG(d.k,d.v,d.u,d.step,d.t)}});}},
  {k:'calc',w:2,f(){const d=data();const mx=Math.max(...d.v);return MC('calc',`가장 많은 항목은?`,d.k[d.v.indexOf(mx)],d.k.filter((x,i)=>d.v[i]!==mx),'막대가 가장 긴 것',{extra:{fig:barGraphSVG(d.k,d.v,d.u,d.step,d.t)}});}},
  {k:'word',w:3,f(){const d=data();const [i,j]=sample(range(0,d.k.length-1),2);const [a,b]=d.v[i]>d.v[j]?[i,j]:[j,i];return W(`${d.k[a]}은(는) ${d.k[b]}보다 몇 ${d.u} 더 많을까요?`,d.v[a]-d.v[b],d.u,`${d.v[a]} - ${d.v[b]}`,{extra:{fig:barGraphSVG(d.k,d.v,d.u,d.step,d.t)}});}},
  {k:'word',w:2,f(){const d=data();const s=d.v.reduce((a,b)=>a+b,0);return W(`조사한 전체 수는 몇 ${d.u}일까요?`,s,d.u,`${d.v.join('+')} = ${s}`,{extra:{fig:barGraphSVG(d.k,d.v,d.u,d.step,d.t)}});}},

  {k:'calc',w:1,f(){return MC('calc','막대그래프에 대한 설명으로 옳은 것은?','항목별 수량의 많고 적음을 한눈에 비교하기 쉬워요.',['전체 합계가 그래프에 꼭 쓰여 있어요.','막대의 굵기로 수량을 나타내요.','눈금 한 칸은 항상 1이에요.'],'막대의 길이로 수량을 나타내요.');}}

{id:'m4u6',sem:'1학기',title:'규칙 찾기',goal:'수의 배열, 도형의 배열, 계산식의 배열에서 규칙을 찾아요.',
 concept:[

  {k:'calc',w:2,f(){const a=R(2,5),r=pick([2,3]);const seq=range(0,4).map(i=>a*r**i);const h=R(2,4);return C(`규칙을 찾아 □에 알맞은 수를 쓰세요.<br><span class="big">${seq.map((v,i)=>i===h?'□':v).join(', ')}</span>`,seq[h],`${r}씩 곱해요.`);}},
  {k:'calc',w:2,f(){const n=R(4,6);const ones='1'.repeat(n);const ans=String(+ones* +ones);return C(`규칙을 이용하여 계산 결과를 쓰세요.<br>1 × 1 = 1<br>11 × 11 = 121<br>111 × 111 = 12321<br><b>${ones} × ${ones} = □</b>`,ans,'1부터 n까지 올라갔다가 다시 내려와요.',{extra:{fields:[{a:ans,w:'wide'}]}});}},
  {k:'calc',w:2,f(){const s=R(1,4)*100,k=R(4,6);const row=i=>`${s+100*i} + ${s+100*(i+1)} = ${2*s+100*(2*i+1)}`;return C(`계산식의 규칙을 찾아 □에 알맞은 수를 쓰세요.<br>${range(0,2).map(row).join('<br>')}<br><b>${s+100*k} + ${s+100*(k+1)} = □</b>`,2*s+100*(2*k+1),'합이 200씩 커져요.');}},
  {k:'word',w:3,f(){const n=R(5,9);return W(`바둑돌을 정사각형 모양으로 첫째 1개, 둘째 4개, 셋째 9개, 넷째 16개 놓았어요. ${n}째에 놓을 바둑돌은 몇 개일까요?`,n*n,'개',`${n} × ${n} = ${n*n}`);}},
  {k:'word',w:2,f(){const a=R(3,5),d=R(2,4),n=R(6,10);return W(`성냥개비로 첫째 ${a}개, 둘째 ${a+d}개, 셋째 ${a+2*d}개가 되도록 규칙적으로 놓았어요. ${n}째에는 몇 개가 필요할까요?`,a+d*(n-1),'개',`${d}개씩 늘어나요: ${a} + ${d}×${n-1} = ${a+d*(n-1)}`);}},
  {k:'word',w:2,f(){const st=R(2,4)*1000,start=R(10,30)*1000,m=R(4,7);return W(`${J(nm(),'은는')} 1월에 ${fmt(start)}원을 저금하고, 다음 달부터 전달보다 ${fmt(st)}원씩 더 많이 저금하기로 했어요. ${m}월에는 얼마를 저금할까요?`,start+st*(m-1),'원',`${fmt(start)} + ${fmt(st)}×${m-1}`,{extra:{fields:[{a:[String(start+st*(m-1)),fmt(start+st*(m-1))],u:'원',w:'wide'}]}});}}
 ]},
{id:'m4u7',sem:'2학기',title:'분수의 덧셈과 뺄셈',goal:'분모가 같은 분수의 덧셈과 뺄셈을 해요.',

  {k:'calc',w:3,f(){const d=R(3,12),a=R(1,d-2),b=R(1,d-1-a);return FR('calc',`<span class="big">${F(a,d)} + ${F(b,d)}</span>`,a+b,d,null,`분자끼리: ${a}+${b}=${a+b}`);}},
  {k:'calc',w:3,f(){const d=R(3,12),a=R(2,d-1),b=R(1,a-1);return FR('calc',`<span class="big">${F(a,d)} - ${F(b,d)}</span>`,a-b,d,null,`분자끼리: ${a}-${b}=${a-b}`);}},
  {k:'calc',w:3,f(){const d=R(3,9),a=R(1,d-1),b=R(d-a+1,d-1);if(a+b<=d)return null;const [w,n]=toMixed(a+b,d);return FR('calc',`<span class="big">${F(a,d)} + ${F(b,d)}</span> (대분수로)`,n,d,w,`${F(a+b,d)} = ${F(n,d,w)}`);}},
  {k:'calc',w:3,f(){const d=R(3,9),w1=R(1,4),n1=R(1,d-1),w2=R(1,4),n2=R(1,d-1);const t=(w1+w2)*d+n1+n2;const [w,n]=toMixed(t,d);if(!n)return null;return FR('calc',`<span class="big">${F(n1,d,w1)} + ${F(n2,d,w2)}</span>`,n,d,w,`자연수끼리 ${w1+w2}, 분수끼리 ${F(n1+n2,d)}`);}},
  {k:'calc',w:3,f(){const d=R(3,9),w1=R(3,6),n1=R(1,d-1),w2=R(1,w1-1),n2=R(1,d-1);const t=w1*d+n1-(w2*d+n2);const [w,n]=toMixed(t,d);if(!n||t<=0)return null;return FR('calc',`<span class="big">${F(n1,d,w1)} - ${F(n2,d,w2)}</span>`,n,d,w,n1<n2?'분수끼리 뺄 수 없으니 1을 받아내림해요.':'자연수끼리, 분수끼리 빼요.');}},
  {k:'calc',w:2,f(){const d=R(3,9),k=R(2,5),w2=R(1,k-1),n2=R(1,d-1);const t=k*d-(w2*d+n2);const [w,n]=toMixed(t,d);return FR('calc',`<span class="big">${k} - ${F(n2,d,w2)}</span>`,n,d,w===0?null:w,`${k} = ${F(d,d,k-1)}로 바꾸어 빼요.`);}},
  {k:'word',w:3,f(){const d=pick([5,6,7,8,9,10]),a=R(1,d-2),b=R(1,d-1-a);return FR('word',`우유를 오전에 ${F(a,d)}L, 오후에 ${F(b,d)}L 마셨어요. 하루 동안 마신 우유는 몇 L일까요?`,a+b,d,null,`${F(a,d)} + ${F(b,d)} = ${F(a+b,d)}`);}},
  {k:'word',w:3,f(){const d=pick([4,5,6,8]),w1=R(2,5),n1=R(1,d-1),n2=R(1,d-1),w2=R(1,w1-1);const t=w1*d+n1-(w2*d+n2);const [w,n]=toMixed(t,d);if(!n||t<=0)return null;return FR('word',`리본 ${F(n1,d,w1)}m 중에서 ${F(n2,d,w2)}m를 사용했어요. 남은 리본은 몇 m일까요?`,n,d,w===0?null:w,`${F(n1,d,w1)} - ${F(n2,d,w2)} = ${F(n,d,w)}`);}},
  {k:'word',w:2,f(){const d=pick([5,7,9]),a=R(1,3),b=R(1,3);if(a+b>=d)return null;return FR('word',`피자 한 판 중 ${J(nm(),'은는')} ${F(a,d)}, 동생은 ${F(b,d)}를 먹었어요. 남은 피자는 전체의 얼마일까요?`,d-a-b,d,null,`1 - ${F(a,d)} - ${F(b,d)} = ${F(d-a-b,d)}`,{extra:{hint:'피자 한 판 전체를 1로 생각해요.'}});}}
 ]},

  {k:'word',w:2,f(){const s=R(3,9),P=s*2+R(2,8);return W(`둘레가 ${P}cm인 이등변삼각형에서 길이가 같은 두 변이 각각 ${s}cm라면 나머지 한 변은 몇 cm일까요?`,P-2*s,'cm',`${P} - ${s}×2 = ${P-2*s}`);}}

function senGen(){ // 문장 이해(누가/언제/어디서/무엇을)
  const who=pick(['다람쥐','곰돌이','민지','형','토끼','할머니','선생님','아기 오리']);const when=pick(['아침에','점심에','저녁에','어제','오늘','토요일에']);
  const [where,obj,verb]=pick([['공원에서','공을','찼어요'],['부엌에서','쿠키를','구웠어요'],['도서관에서','동화책을','읽었어요'],['바닷가에서','조개를','주웠어요'],['놀이터에서','그네를','탔어요'],['숲속에서','도토리를','모았어요'],['교실에서','그림을','그렸어요'],['시장에서','사과를','샀어요']]);
  const s=`${J(who,'이가')} ${when} ${where} ${obj} ${verb}.`;const ask=pick(['who','when','where','what']);
  const qs={who:['누가',who,['다람쥐','곰돌이','민지','형','토끼','할머니','선생님','아기 오리']],when:['언제',when,['아침에','점심에','저녁에','어제','오늘','토요일에']],where:['어디에서',where,['공원에서','부엌에서','도서관에서','바닷가에서','놀이터에서','숲속에서','교실에서','시장에서']],what:['무엇을',obj,['공을','쿠키를','동화책을','조개를','그네를','도토리를','그림을','사과를']]};
  const [w,a,pool]=qs[ask];return RD(`<div class="passage" style="white-space:normal">${s}</div><b>${w}</b> 했나요?`,a,pool.filter(x=>x!==a).sort(()=>Math.random()-.5),`문장에서 ‘${w}’에 해당하는 말은 ‘${a}’예요.`);
}
